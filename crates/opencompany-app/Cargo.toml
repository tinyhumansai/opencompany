# The desktop shell — package `opencompany-app`, the "app" flavour of
# OpenCompany beside `opencompany-core` (the host) and `opencompany-tui` (the
# terminal client).
#
# ## A separate workspace, deliberately
#
# This crate is `exclude`d from the root workspace (`Cargo.toml` at the
# repository root), and that is a decision rather than an oversight. Adding it
# as a member would make every root `cargo` invocation
# resolve the whole Tauri dependency tree — `cargo metadata --locked` runs first
# in CI, and `Cargo.lock` would carry several hundred entries the host never
# compiles. Worse, any lane that widened to `--workspace` would need
# `libwebkit2gtk`, `libsoup` and GTK installed on a runner that has none of
# them, turning a desktop-only dependency into a hard requirement for checking
# the server.
#
# The host stays a plain `path` dependency, so a change to it is picked up here
# with no publishing step. The desktop gets its own CI lane when it ships.
[workspace]

[package]
name = "opencompany-app"
version = "0.3.2"
edition = "2024"
license = "GPL-3.0-only"
description = "OpenCompany desktop shell: many hosts at once, and local ACP harnesses."
publish = false

# The package was renamed from `opencompany-desktop` when it moved under
# `crates/`; the library and executable names below did NOT change. The
# executable name is part of the shipped bundle's identity (the updater replaces
# an `.app` whose binary is `opencompany-desktop`), and the library name is in
# the tracing filter in `src/lib.rs`. Only the Cargo package is called
# `opencompany-app`.
[lib]
# Tauri's mobile entry point wants a `cdylib`; the `rlib` is what the
# integration tests link against. The proxy and embedded-server logic lives in
# the library precisely so it can be tested without starting a webview.
name = "opencompany_desktop_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "opencompany-desktop"
path = "src/main.rs"

[dependencies]
# The host, linked rather than spawned. `sqlite` is the desktop's backend;
# `mongodb` is deliberately absent — a per-tenant cluster is a hosting concern.
#
# `mcp` is what puts an agent harness in the app at all. Without it this build
# has no `openhuman` feature, so `src/harness/` is not compiled, no company can
# reach a model, and the console's inference test answers "This build cannot
# reach a model — the agent harness is not compiled in." `mcp` implies
# `openhuman`, and the host's `openhuman_core` dependency is declared
# `default-features = false, features = ["skills", "mcp", "hosting"]` — so what
# a desktop agent gets is exactly the minimal belt: built-in tools, MCP servers
# and skills.
#
# ## What is NOT in this list is not the same as what the app ships without
#
# `composio` and `acp` are **not** in the feature list below and they ARE in the
# shipped application: `DESKTOP_RELEASE_FEATURES` in
# `.github/workflows/build-desktop.yml` passes
# `opencompany-core/acp,opencompany-core/composio` on the `tauri build` command line, and
# The CI lane plan's desktop lane compiles and tests that same string. Both are
# `= ["openhuman"]` in the root manifest — pure `cfg` switches that pull no
# `dep:` entry, and `mcp` above already enables `openhuman` — so turning them
# on adds no package and leaves this crate's `Cargo.lock` byte-identical, and
# that is what lets a release still build `--locked`. It is why they are passed
# rather than written here; the argument is spelled out on that env block.
#
# What each buys is on that env block too, and the short version for `acp` is
# worth keeping here because the comment this replaces got it backwards:
# `src/acp/` in THIS crate is an ACP *client* and compiles either way, so the
# feature looks inert from inside the manifest. What it actually gates is
# `RuntimeBuilder::with_acp_agents` in the host — without it `acp_agents` is
# forced to `None` and every `transport = "local"` harness resolves
# `unavailable`, on the one host that has an `AcpAgentFactory` to hand over
# (issue #1245). It is not a separate decision from having a harness; on the
# desktop it is what makes the local harness lane exist.
#
# Reading this manifest as the whole story is issue #1738: it reported the
# desktop's eight Connections tiles reading "not available here" over a card
# inviting the operator to paste a Composio token, cited the exclusion comment
# that used to sit here as the reason, and concluded the shipped app's
# integration surface was dark. The DMG's surface is not dark. What was dark was
# every desktop built WITHOUT that command line — which, until this issue, was
# every developer's, because `scripts/desktop-dev.sh` ran `tauri dev` bare. The
# dev shell and the shipped app were two different products and nothing said so.
# #1823 closed that half, and closed it better than a copy would have: the
# script *parses* `DESKTOP_RELEASE_FEATURES` out of the release workflow, so the
# launcher cannot drift from what ships. `scripts/ci/assert-desktop-features.sh`
# guards the copies that remain — the two desktop-lane steps in `scripts/ci/lanes/lanes-plan.mjs`, `tauri:build` and the
# command `docs/spec/runtime/desktop.md` documents — and asserts the launcher
# still derives rather than duplicates.
#
# Deliberately NOT compiled at all, in the default set or the release one, and
# each for a reason rather than an oversight:
#
# * `media` — the image/video generation tools. Unlike `composio` it is
#   `["openhuman", "openhuman_core/media"]`, so it does pull an upstream domain
#   this build otherwise never compiles, and its credential really is managed:
#   the tools are wired only when a company grants the namespace AND a
#   *platform* credential is configured. There is no BYO tier, so no desktop
#   operator has anything to supply, and `…/capabilities` answers
#   `media_in_build: false`, which is the honest report of that.
#
# There is no `search` to exclude. The comment this replaces named one among
# "the rest of the managed backends", but no such cargo feature exists —
# `…/capabilities` derives `search_in_build` from `cfg!(feature =
# "openhuman")`, which `mcp` already turns on. Search has been in this build
# the whole time the comment claimed it was kept out.
#
# The claim that the excluded set "needs a platform credential the desktop has
# no way to hold" was also wrong about `composio` specifically, which is worth
# recording so it is not re-derived. `company::composio::resolve_credential` is
# always compiled and answers over *three* tiers, the platform identity being
# the LAST: the BYO `composio/tinyhumans/key` override wins, else the company's own
# TinyHumans key, else this instance's platform identity. Tier one is precisely
# what a desktop operator can hold, and the Connections card already asks them
# for it.
#
# `tinymemory` IS here, in the features below. It is the cheap half of the
# memory seam — TinyMemory v2's engine registry (CortexDB direct, CortexDB via
# the TinyHumans backend), plus the host's own "No memory" engine — pure Rust and
# already in the lockfile — and the memory-engine catalog is a console surface
# the desktop serves too. Without it its tiles render disabled with "this build
# was compiled without the `tinymemory` feature", an instruction no desktop user
# can follow. There is no in-pod memory engine to exclude any more; the runtime
# keeps its fs-backed memory stores.
# `tinyhumans` is what makes this host able to ask the hub whose credential it
# is holding. Without it `HttpHubIdentityExchange` and `HttpTinyHumansClient`
# are not compiled, `hub_identity()` stays `None`, and the Account page reports
# that this host is not part of a TinyHumans ecosystem while
# `credential/link/start` refuses with the same sentence. It is `["dep:reqwest"]`
# and nothing else, and `oauth` above already pulls reqwest, so it adds no
# package and leaves `Cargo.lock` byte-identical — which is what lets a release
# still build `--locked`.
#
# The package is `opencompany-core`; its library crate is still named
# `opencompany`, which is why the code says `use opencompany::`.
# `crash-reporting` gives the shell and every embedded host the same optional,
# operator-configured Sentry client as the server binary. It remains inert
# without `OPENCOMPANY_SENTRY_DSN`.
# `analytics` compiles the OpenPanel transport, so the desktop reports product
# analytics from the Rust host (never the webview; the CSP is unchanged) — on by
# default, off by the user's Settings -> Privacy choice or
# `OPENCOMPANY_ANALYTICS=off`. It is `["dep:reqwest"]` and nothing else, and
# `oauth` above already pulls reqwest, so it adds no package and leaves
# `Cargo.lock` byte-identical. It lives on this line, like `tinyhumans` and
# `crash-reporting`, so dev, CI and release share one source rather than a
# fourth copy of the feature string. `src/analytics.rs` supplies the deployment,
# switch, client id and endpoint a double-clicked app has no environment for.
opencompany-core = { path = "../opencompany-core", default-features = false, features = ["sqlite", "platform-jwt", "oauth", "mcp", "tinymemory", "tinyhumans", "crash-reporting", "analytics"] }

tauri = { version = "2", features = [] }
# The OS credential store, so a device session token never has to live in the
# webview or on disk in the clear. Native backends only — the same set
# `vendor/openhuman` uses, and for the same reason: a pure-Rust fallback would
# mean a secret store that is not the platform's.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-shell = "2"

tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
tauri-plugin-updater = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The host's `[patch]` table (the workspace root `Cargo.toml`), rebased two
# directories up.
#
# A `[patch]` section only takes effect in the workspace root that declares it,
# and this crate is deliberately its own workspace (see the header). Until the
# `mcp` feature above put `openhuman_core` in this graph none of these crates
# were reachable from here, so the table could be omitted; now they are, and
# without it Cargo resolves `tinyflows` and friends from
# crates.io (where some do not exist at all) instead of the vendored checkouts
# the host is built against — and any that did resolve would be a *second*
# copy, whose trait identities would not match the ones `opencompany` compiled.
#
# Keep this byte-identical to the root table modulo the `../../` prefix. The
# comments explaining each entry live there; this is the replica.
# At the 1ecf1b0 pin `tinyinference` is a workspace of six crates
# (`tinyinference-{core,embeddings,llm,local,providers,voice}`) and the single
# `tinyinference` package no longer exists; the entries mirror the root
# manifest's own `[patch]` table one for one. A patch path is resolved eagerly
# whatever the feature set, so a stale entry here fails `cargo metadata
# --locked` outright — this is what broke the Desktop lane.
[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference-core = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

# `tinyhivemind-openhuman` names `openhuman-embed` by git URL; without this
# entry Cargo resolves a second `openhuman_embed::Agent` beside the vendored
# path copy this crate builds against, and `AgentBinding::new` (which takes
# the git-sourced `Agent`) refuses the path-sourced one as a type mismatch.
# Replicated from the root manifest's own `[patch."https://github.com/tinyhumansai/openhuman"]`
# entry, path rebased the same `../../` as every other entry in this table.
[patch."https://github.com/tinyhumansai/openhuman"]
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed" }
openhuman = { path = "../../vendor/openhuman/crates/openhuman-core" }

[patch."https://github.com/tinyhumansai/tinytools"]
tinytools = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch.crates-io]
tinyflows = { path = "../../vendor/openhuman/vendor/tinyflows/crates/tinyflows" }
tinychannels = { path = "../../vendor/openhuman/vendor/tinychannels" }
motosan-ai-oauth = { path = "../../vendor/openhuman/vendor/motosan-ai-oauth" }
# The six tinyinference crates by registry name as well, matching the root
# manifest's `[patch.crates-io]` table: `tinyagents-harness` names them with
# `version = "0.3.0"` beside the path, and any crate reaching them by version
# alone must land on the same vendored copy or `ChatModel` exists twice.
tinyinference-core = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "../../vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

# This crate is its own Cargo world, so it needs the workspace's symbolication
# policy explicitly.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
