}

"""
One roster teammate. Mirrors `frontend/src/lib/team.ts`.
"""
type TeamMember {
	"""
	The teammate id.
	"""
	id: ID!
	"""
	The display name; null for a manifest teammate named only by role.
	"""
	name: String
	"""
	The job title / role.
	"""
	role: String!
	"""
	An optional description.
	"""
	description: String
	"""
	Whether this teammate has an enabled inbox.
	"""
	inboxEnabled: Boolean!
	"""
	This teammate's daily spend cap in force (issue #304), or null when it
	has none. Null-vs-set is the capped/uncapped distinction — `0` would
	mean "capped at nothing".
	
	Since #343 this is the **effective** cap: an operator override set from
	the console when one is stored, the manifest value otherwise.
	"""
	budgetUsdDaily: Float
	"""
	What this teammate has spent since 00:00 UTC; non-null only alongside a
	cap.
	"""
	spentTodayUsd: Float
	"""
	The user id of the admin who last set this teammate's cap from the
	console (issue #343); null when no override is stored. Non-null even
	when the override *removed* the cap, which is how "nobody capped this"
	is told from "an admin uncapped this".
	"""
	budgetSetBy: String
	"""
	When that cap was set (epoch millis). `Float` round-trips the full u64
	range that would overflow GraphQL's `Int`, matching `Approval.atMillis`.
	"""
	budgetSetAtMillis: Float
}

"""
The source-template provenance of a company: where its manifest was seeded
from. Mirrors [`TemplateProvenance`](crate::ports::types::TemplateProvenance).
"""
type TemplateProvenance {
	"""
	The template's stable identifier — the source directory slug.
	"""
	sourceId: String!
	"""
	The template's version, when the source exposes one.
	"""
	version: String
	"""
	The source directory path the company was launched from, when recorded.
	"""
	path: String
}

"""
One ledger transaction in the finance journal.
"""
type Transaction {
	"""
	The transaction id.
	"""
	id: ID!
	"""
	The transaction date, `YYYY-MM-DD`.
	"""
	date: String!
	"""
	A human description.
	"""
	description: String!
	"""
	The spend category.
	"""
	category: String!
	"""
	The amount, USD (a positive magnitude; see `direction`).
	"""
	amountUsd: Float!
	"""
	`in` for revenue, `out` for spend.
	"""
	direction: String!
}

"""
The usage read surface for a company.
"""
type Usage {
	"""
	The daily token series.
	"""
	series: [UsagePoint!]!
	"""
	Tokens by teammate.
	"""
	byAgent: [AgentTokens!]!
	"""
	Calls by provider.
	"""
	byProvider: [ProviderCalls!]!
	"""
	Aggregate totals.
	"""
	totals: UsageTotals!
}

"""
One day's token totals.
"""
type UsagePoint {
	"""
	The day, `YYYY-MM-DD`.
	"""
	date: String!
	"""
	Input tokens that day.
	"""
	inputTokens: Float!
	"""
	Output tokens that day.
	"""
	outputTokens: Float!
}

"""
The usage lookback window.
"""
enum UsageRange {
	"""
	The last 7 days.
	"""
	D7
	"""
	The last 30 days (the default).
	"""
	D30
	"""
	The last 90 days.
	"""
	D90
}

"""
Aggregate usage totals for the window.
"""
type UsageTotals {
	"""
	Total input tokens.
	"""
	inputTokens: Float!
	"""
	Total output tokens.
	"""
	outputTokens: Float!
	"""
	Total tokens (input + output).
	"""
	tokens: Float!
	"""
	Total inference cost, USD.
	"""
	costUsd: Float!
	"""
	Total OAuth calls.
	"""
	oauthCalls: Float!
	"""
	Number of distinct connections used.
	"""
	connections: Int!
	"""
	Total metered web searches (issue #238). Their USD cost is already
	inside `cost_usd`; this is the call count.
	"""
	searchCalls: Float!
}

"""
A full workflow graph.
"""
type Workflow {
	"""
	The workflow id.
	"""
	id: ID!
	"""
	The workflow display name.
	"""
	name: String!
	"""
	The graph nodes.
	"""
	nodes: [WorkflowNode!]!
	"""
	The graph edges.
	"""
	edges: [WorkflowEdge!]!
}

"""
One directed edge in a workflow graph.
"""
type WorkflowEdge {
	"""
	The source node id.
	"""
	from: ID!
	"""
	The target node id.
	"""
	to: ID!
	"""
	An optional edge label.
	"""
	label: String
}

"""
One node in a workflow graph.
"""
type WorkflowNode {
	"""
	The node id.
	"""
	id: ID!
	"""
	The node kind (`trigger`, `agent`, `toolCall`, ...).
	"""
	kind: String!
	"""
	The node display name.
	"""
	name: String!
	"""
	An optional one-line summary.
	"""
	summary: String
	"""
	Free-form, kind-specific node config (P1), exposed as a JSON scalar so
	`Company.workflow(id)` does not drop model data.
	"""
	config: JSON
	"""
	Per-node error policy: `stop` / `continue` / `route`.
	"""
	onError: String
	"""
	Per-node retry policy (attempts + backoff), as a JSON scalar. Keys are
	camelCase (`maxAttempts` / `backoffMs`) to match the REST read shape;
	see [`RetryGql`].
	"""
	retry: JSON
	"""
	Whether the node pauses awaiting operator approval before it runs.
	"""
	requiresApproval: Boolean
	"""
	Where an `output` node's report is routed once the run finishes (issue
	#170), as a JSON scalar: `{"kind": "owner"|"email"|"channel",
	"target"?: "…"}`. Exposed for the same reason `config` is — so
	`Company.workflow(id)` does not drop model data. Both keys are single
	words, so the model shape needs no camelCase mirror the way `retry` does.
	"""
	destination: JSON
}

"""
A one-line workflow summary for the workflows list.
"""
type WorkflowSummary {
	"""
	The workflow id.
	"""
	id: ID!
	"""
	The workflow display name.
	"""
	name: String!
	"""
	Whether the workflow id appears in the company manifest's
	`[workflows].enabled` list.
	
	This is manifest membership, **not** "does this workflow exist and can it
	run". A runtime-authored workflow is listed here whether or not it is
	manifest-enabled, and `Company.workflow(id)` / the run routes serve any
	saved graph regardless of this flag — nothing consults it to decide
	whether a workflow may run. Treat it as "declared by the blueprint".
	"""
	enabled: Boolean!
}

"""
A single workspace file with its content and inbound `[[wikilink]]` backlinks.
"""
type WorkspaceFile {
	"""
	The file id.
	"""
	id: ID!
	"""
	The file name.
	"""
	name: String!
	"""
	The file content.
	"""
	content: String!
	"""
	When it was last updated, ISO-8601 UTC.
	"""
	updatedAt: String!
	"""
	Other files whose content links to this one via `[[name]]`.
	"""
	backlinks: [FsNode!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
}
