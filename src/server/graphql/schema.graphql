	The transaction date, `YYYY-MM-DD`.
	"""
	date: String!
	"""
	A human description.
	"""
	description: String!
	"""
	The spend category.
	"""
	category: String!
	"""
	The amount, USD (a positive magnitude; see `direction`).
	"""
	amountUsd: Float!
	"""
	`in` for revenue, `out` for spend.
	"""
	direction: String!
}

"""
The usage read surface for a company.
"""
type Usage {
	"""
	The daily token series.
	"""
	series: [UsagePoint!]!
	"""
	Tokens by teammate.
	"""
	byAgent: [AgentTokens!]!
	"""
	Calls by provider.
	"""
	byProvider: [ProviderCalls!]!
	"""
	Aggregate totals.
	"""
	totals: UsageTotals!
	"""
	Whether positive cost was withheld by the reader's role.
	"""
