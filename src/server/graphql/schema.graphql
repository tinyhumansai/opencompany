	"""
	Input tokens that day.
	"""
	inputTokens: Float!
	"""
	Output tokens that day.
	"""
	outputTokens: Float!
}

"""
The usage lookback window.
"""
enum UsageRange {
	"""
	The last 7 days.
	"""
	D7
	"""
	The last 30 days (the default).
	"""
	D30
	"""
	The last 90 days.
	"""
	D90
}

"""
Aggregate usage totals for the window.
"""
type UsageTotals {
	"""
	Total input tokens.
	"""
	inputTokens: Float!
	"""
	Total output tokens.
	"""
	outputTokens: Float!
	"""
	Total tokens (input + output).
	"""
	tokens: Float!
	"""
	Total inference cost, USD.
	"""
	costUsd: Float
	"""
	Total OAuth calls.
	"""
	oauthCalls: Float!
	"""
	Number of distinct connections used.
	"""
	connections: Int!
	"""
	Total metered web searches (issue #238). Their USD cost is already
	inside `cost_usd`; this is the call count.
	"""
	searchCalls: Float!
}

"""
A full workflow graph.
"""
type Workflow {
	"""
	The workflow id.
	"""
	id: ID!
	"""
	The workflow display name.
	"""
	name: String!
	"""
	The graph nodes.
	"""
	nodes: [WorkflowNode!]!
	"""
	The graph edges.
	"""
	edges: [WorkflowEdge!]!
}

"""
One directed edge in a workflow graph.
"""
type WorkflowEdge {
	"""
	The source node id.
	"""
	from: ID!
	"""
	The target node id.
	"""
	to: ID!
	"""
	An optional edge label.
	"""
	label: String
}

"""
One node in a workflow graph.
"""
type WorkflowNode {
	"""
	The node id.
	"""
	id: ID!
	"""
	The node kind (`trigger`, `agent`, `toolCall`, ...).
	"""
	kind: String!
	"""
	The node display name.
	"""
	name: String!
	"""
	An optional one-line summary.
	"""
	summary: String
	"""
	Free-form, kind-specific node config (P1), exposed as a JSON scalar so
	`Company.workflow(id)` does not drop model data.
	"""
	config: JSON
	"""
	Per-node error policy: `stop` / `continue` / `route`.
	"""
	onError: String
	"""
	Per-node retry policy (attempts + backoff), as a JSON scalar. Keys are
	camelCase (`maxAttempts` / `backoffMs`) to match the REST read shape;
	see [`RetryGql`].
	"""
	retry: JSON
	"""
	Whether the node pauses awaiting operator approval before it runs.
	"""
	requiresApproval: Boolean
	"""
	Where an `output` node's report is routed once the run finishes (issue
	#170), as a JSON scalar: `{"kind": "owner"|"email"|"channel",
	"target"?: "…"}`. Exposed for the same reason `config` is — so
	`Company.workflow(id)` does not drop model data. Both keys are single
	words, so the model shape needs no camelCase mirror the way `retry` does.
	"""
	destination: JSON
	"""
	A node's declared deterministic postcondition (issue #1866), as a JSON
	scalar for the same reason `destination` is — `require`/`field` are
	single words, so no camelCase mirror is needed.
	"""
	postcondition: JSON
}

"""
A one-line workflow summary for the workflows list.
"""
type WorkflowSummary {
	"""
	The workflow id.
	"""
	id: ID!
	"""
	The workflow display name.
	"""
	name: String!
	"""
	Whether the workflow id appears in the company manifest's
	`[workflows].enabled` list.
	
	This is manifest membership, **not** "does this workflow exist and can it
	run". A runtime-authored workflow is listed here whether or not it is
	manifest-enabled, and `Company.workflow(id)` / the run routes serve any
	saved graph regardless of this flag — nothing consults it to decide
	whether a workflow may run. Treat it as "declared by the blueprint".
	"""
	enabled: Boolean!
}

"""
A single workspace file with its content and inbound `[[wikilink]]` backlinks.
"""
type WorkspaceFile {
	"""
	The file id.
	"""
	id: ID!
	"""
	The file name.
	"""
	name: String!
	"""
	The file content.
	"""
	content: String!
	"""
	When it was last updated, ISO-8601 UTC.
	"""
	updatedAt: String!
	"""
	Who created this file.
	"""
	createdBy: WorkspaceOrigin!
	"""
	Who last wrote the content above.
	"""
	updatedBy: WorkspaceOrigin!
	"""
	Other files whose content links to this one via `[[name]]`.
	"""
	backlinks: [FsNode!]!
}

"""
Who authored a workspace node. Mirrors [`WorkspaceOrigin`] (issue #326).

Flattened into `kind` + optional `agentId` rather than exposed as a GraphQL
union: `agentId` is non-null exactly when `kind` is `agent`, and a union of
two empty types plus one single-field type buys a client nothing but three
inline fragments. The Rust type keeps the invariant; this is its projection.
"""
type WorkspaceOrigin {
	"""
	`seed`, `operator` or `agent`.
	"""
	kind: String!
	"""
	The agent's roster id — set only when `kind` is `agent`.
	"""
	agentId: String
}

"""
One workspace search hit (issue #607).

The node is nested rather than flattened: `FsNode` is already the projection
every other workspace read hands back, and re-declaring its fields here would
be a second copy to keep in step. What search adds is the two things only a
search knows — where the node sits, and why it came back.
"""
type WorkspaceSearchHit {
	"""
	The matching node.
	"""
	node: FsNode!
	"""
	Its logical path, e.g. `standards/Engineering.md`.
	"""
	path: String!
	"""
	`name` or `content`.
	"""
	matched: String!
	"""
	Text around the first body match; null for a name match, a folder and a
	binary node.
	"""
	excerpt: String
}

"""
A page of workspace search hits, plus how many matched in total.
"""
type WorkspaceSearchResults {
	"""
	The hits: name matches first, then content matches, freshest first
	within each group.
	"""
	hits: [WorkspaceSearchHit!]!
	"""
	Matches before the limit was applied.
	"""
	total: Int!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
}
