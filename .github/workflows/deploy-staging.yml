# Build this repo's OWN image (the tenant workload) on every push to main and
# publish it to GitHub Container Registry as the STAGING tenant image.
#
#   ghcr.io/tinyhumansai/opencompany:staging       moves with main
#   ghcr.io/tinyhumansai/opencompany:sha-<short>   this exact build
#
# That is ALL it does. Tenants are no longer run on a k3s node this workflow
# reaches into: they are boat.dev sandboxes managed by
# tinyhumansai/opencompany-sandbox-manager, which pulls the image itself and
# keeps production tenants on the newest GitHub Release
# (opencompany-sandbox-manager#6). So there is no AWS role, no ECR, no SSH key,
# no kubectl and no tenant-image ConfigMap here any more — nothing in this
# workflow can touch a running tenant. A staging sandbox that wants main's head
# pulls `:staging`; one that wants a fixed build pins `:sha-<short>` (or the
# digest the job summary records).
#
# RELEASE images are NOT built here. `release-production.yml` builds the tagged,
# version-bumped tree and pushes `:v<version>` and `:latest` before the GitHub
# Release goes public. A push to main is not a release, so this workflow never
# moves `:latest`.
#
# The GHCR package must be PUBLIC for a sandbox to pull it anonymously — see the
# note on the `publish-docker` job in `release-production.yml`.
#
# Credentials: only the run's GITHUB_TOKEN, widened to `packages: write` on the
# one job that pushes, plus the repository-level SENTRY_AUTH_TOKEN for the
# source-map / debug-symbol upload the image build performs. No PAT: this repo
# and every crate the build compiles (openhuman and its nested vendor graph)
# are public.
#
# `env.TENANT_FEATURES` below is the SINGLE SOURCE OF TRUTH for the hosted
# tenant's feature set: `release-staging.yml` and `release-production.yml` read
# it out of this file at build time rather than keeping copies.
#
# Issue #590. Every `uses:` below is a full commit SHA with the resolved version
# in a trailing comment — `actions/*` included, no exemptions. The rationale is
# at the top of `ci.yml`; the `Actions pinned` job there enforces it. Bumps
# arrive as Dependabot PRs; re-resolve any hand edit with
# `gh api repos/<owner>/<action>/commits/<tag> --jq .sha`.
name: Publish staging tenant image

on:
  push:
    branches: [main]
    # Every path the image is actually built from. A file that reaches the
    # image but is absent here merges to main and changes nothing in staging
    # until some unrelated selected path happens to move — so the rule for
    # adding one is simply: is it `COPY`ed by the Dockerfile, or read by
    # something that is?
    paths:
      - 'crates/opencompany-core/**' # the host crate: manifest, build.rs and sources
      - 'crates/opencompany-tui/**' # a workspace member the builder has to COPY
      - 'frontend/**'
      - 'companies/**'
      - 'deploy/Dockerfile'
      - 'deploy/Dockerfile.dockerignore'
      - 'deploy/entrypoint.sh' # COPYed in, and the container's ENTRYPOINT
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml' # COPYed into the builder; it picks the compiler
      - 'vendor/**'
      - '.github/workflows/deploy-staging.yml'
  # A manual rebuild of main's head (e.g. after a base-image fix). Refused from
  # any other ref by the job's `if:` — see there.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only at workflow scope; the publishing job widens itself.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/tinyhumansai/opencompany
  # The feature set the hosted tenant ships with. Changing it changes what
  # every tenant can do, so treat edits here as a product change, not a CI
  # tweak. Full belt: adds mcp/media/composio (the credential/real-money tool
  # families, fail-closed until their config exists), imap (inbound mail),
  # medulla (hosted brain transport), and sidecar. `sqlite` is intentionally omitted — its bundled rusqlite needs a C
  # compiler the slim build image lacks, and it is redundant on a mongodb tenant.
  #
  # `tinymemory` is the hosted-memory contract: `OPENCOMPANY_MEMORY=remote` +
  # `OPENCOMPANY_MEMORY_DRIVER=supermemory|mem0|cognee` (plus `null`), inert
  # until an operator sets those.
  #
  # `analytics` (issue #1739) is the OpenPanel transport, and this list is the
  # only place it is ever compiled: product analytics reports from **hosted
  # tenants only**, so the image built here is the one build that needs it,
  # while the desktop and self-hosted builds deliberately do not have it.
  # Without it every tenant compiles the `cfg(not(feature = "analytics"))` arm
  # of `openpanel::build`, installs a `NullTracker`, and reports nothing however
  # the deployment kind and credential are injected. It costs the image nothing
  # — `analytics = ["dep:reqwest"]`, and `reqwest` is already here via
  # `openhuman`. A hosted tenant reports with compiled-in defaults (the
  # TinyHumans OpenPanel client id and `https://panel.tinyhumans.ai/api/track`);
  # `OPENCOMPANY_ANALYTICS_CLIENT_ID` / `OPENCOMPANY_ANALYTICS_ENDPOINT` override
  # them and `OPENCOMPANY_ANALYTICS=off` silences it
  # (`docs/spec/runtime/analytics.md`).
  #
  # `crash-reporting` is the Sentry client, and this list is the ONLY thing that
  # decides whether a tenant has one. The feature is the sole path that compiles
  # it, so without this entry every container — even one given an
  # `OPENCOMPANY_SENTRY_DSN` — resolves `Silence::NotCompiled`,
  # prints "off" at boot and reports nothing — the whole surface inert in
  # exactly the deployment that has no other way to be watched. Same shape as
  # the `analytics` note above, and the same reason it is spelled out: a feature
  # list is not self-documenting, and the symptom of an omission is silence.
  #
  # A hosted tenant reports to the compiled-in `opencompany-core` DSN unless
  # `OPENCOMPANY_SENTRY_DSN` overrides it or `OPENCOMPANY_SENTRY=off` silences
  # it — see `docs/spec/runtime/crash-reporting.md`. The image cost is
  # `sentry` plus a small `ureq` on the `rustls` already in the graph; no second
  # HTTP client and no native TLS (`cargo tree -d` is unchanged but for
  # `base64`).
  TENANT_FEATURES: mongodb,openhuman,github,smtp,dns,tinyhumans,webhooks,platform-jwt,export,mcp,media,composio,imap,medulla,sidecar,chargebee,paypal,tinymemory,analytics,crash-reporting

jobs:
  publish:
    name: Build and push staging tenant image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only main may move `:staging`. A dispatch from another branch would build
    # branch-controlled Dockerfile/scripts while holding a `packages: write`
    # token and SENTRY_AUTH_TOKEN, so it is refused before checkout.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # push the tenant image to GHCR under this repository's owner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      # Path-limited on purpose. `--features openhuman` compiles the vendored
      # openhuman crate and its nested graph, and cargo must be able to read the
      # manifests behind [patch.crates-io], so both of these must be present.
      # Recursing from the repo root instead would also drag in openhuman's
      # desktop-only submodules (tauri-cef is a heavy CEF checkout) that no
      # server build compiles.
      #
      # `vendor/tinyhivemind` is also required here even though it is a
      # top-level submodule, not one nested under `vendor/openhuman`:
      # `tinyhivemind-hive` is an unconditional path dependency in `Cargo.toml`
      # (`vendor/tinyhivemind/crates/tinyhivemind-hive`), so Cargo must read its
      # manifest to resolve the dependency graph on every build, feature-gated
      # or not. `ci.yml`'s jobs get this for free from `submodules: true` on
      # their checkout; this job uses `submodules: false` and fetches
      # everything it needs explicitly, so it must fetch this one too.
      - name: Fetch build vendor submodules
        run: |
          git submodule update --init vendor/openhuman vendor/tinyhivemind
          scripts/ci/init-vendored-submodules.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the upload token is configuration; the Sentry URL, org and project
      # slugs are hardcoded in the build-args below.
      - name: Validate Sentry artifact-upload settings
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Required Sentry artifact-upload setting is missing: SENTRY_AUTH_TOKEN" >&2
            exit 1
          fi

      # `sha-<short>` names this build; 12 hex characters, which is what
      # `git rev-parse --short=12` would print and plenty to stay unique.
      - name: Compute tags
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:staging"
            echo "${IMAGE}:sha-${short}"
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image to GHCR
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          # `deploy/Dockerfile.dockerignore` excludes `.git` and `GITHUB_SHA` does not cross
          # into a build context, so the build script has no way to work out
          # which revision it is compiling — every hosted tenant would report
          # `unknown` forever. `actions/checkout` checked out `github.sha`, so
          # this names the commit that was actually built.
          #
          # `VITE_SENTRY_DSN` is deliberately NOT passed: the console bundle
          # defaults to the TinyHumans `opencompany-frontend` DSN in code
          # (`frontend/src/lib/crash-reporting.ts`). `VITE_BUILD_COMMIT` and the
          # rest are the console's build-time inputs: Vite inlines them into
          # the bundle during this image build, so the runtime env cannot
          # supply them (`docs/spec/runtime/crash-reporting.md`).
          #
          # `VITE_SENTRY_ENVIRONMENT` reads the SAME variable the manager injects
          # into the tenant as `OPENCOMPANY_SENTRY_ENVIRONMENT`, so one value
          # tags both surfaces.
          #
          # The `|| 'hosted-tenant'` is the part that matters, because an empty
          # build-arg is NOT the same as an unset one here. Passed empty, the
          # console keeps its own default of `production` while the host keeps
          # its deployment kind — and everything this image builds is a hosted
          # tenant. The fallback is `Deployment::HostedTenant::as_str()`
          # verbatim, which is exactly what the host reports when the manager
          # leaves the variable unset, so unset now means "both agree" instead
          # of "both guess differently".
          #
          # It has to be decided here: the console's copy is baked into the
          # bundle at build time, where the manager's runtime env can never
          # reach it (Codex on #2073).
          #
          # `VITE_SENTRY_TRACES_SAMPLE_RATE` gets NO fallback, unlike the
          # environment above. Absent means `0` and no tracing integration at
          # all, which is what both surfaces already default to and what this
          # repository deliberately chose: transactions bill separately from
          # errors and are emitted per page load, so defaulting anyone into them
          # here would be a recurring cost nobody asked for. Set the variable to
          # turn tracing on knowingly.
          #
          # `VITE_BUILD_COMMIT` takes the SAME value as the Rust half above so
          # both surfaces compute one `opencompany@<version>+<commit>` release
          # string. Passed different values they still both report — and their
          # events silently never join in one filter.
          build-args: |
            FEATURES=${{ env.TENANT_FEATURES }}
            OPENCOMPANY_BUILD_COMMIT=${{ github.sha }}
            VITE_BUILD_COMMIT=${{ github.sha }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.OPENCOMPANY_SENTRY_ENVIRONMENT || 'hosted-tenant' }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.OPENCOMPANY_SENTRY_TRACES_SAMPLE_RATE }}
            SENTRY_URL=https://sentry.tinyhumans.ai
            SENTRY_ORG=tinyhumans
            SENTRY_PROJECT_REACT=opencompany-frontend
            SENTRY_PROJECT_RUST=opencompany-core
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Staging tenant image published to GHCR'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo 'Tags:'
            echo '```'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Product analytics, sent AND read back, against the image just pushed
      # (pulled by its immutable `sha-<short>` tag, so a racing push cannot swap
      # it). Same shape as the release gate in `release-production.yml`: the
      # image sends one `analytics_self_test` as a hosted tenant and exits 0 only
      # when the collector accepted it, then `verify-analytics-capture.sh` reads
      # the profile back from OpenPanel. `VERIFY_ANALYTICS_REQUIRED` is unset, so
      # a missing `OPENPANEL_MCP_BEARER` warns instead of failing the publish.
      # docs/spec/runtime/analytics-smoke.md.
      - name: Verify product analytics (analytics-test)
        env:
          OPENPANEL_MCP_BEARER: ${{ secrets.OPENPANEL_MCP_BEARER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rc=0
          profile="$(docker run --rm \
            --entrypoint opencompany \
            -e OPENCOMPANY_DEPLOYMENT=hosted-tenant \
            "${IMAGE}:sha-${SHA:0:12}" \
            analytics-test)" || rc=$?
          case "$rc" in
            0) ;;
            2) echo "::error::analytics-test says this image would be SILENT as a hosted tenant, so it reports nothing. Check TENANT_FEATURES and the OPENCOMPANY_ANALYTICS switch. See docs/spec/runtime/analytics-status.md." >&2; exit 1 ;;
            *) echo "::error::analytics-test exited ${rc}: the collector did not accept the event (or the image has no analytics transport). See docs/spec/runtime/analytics-status.md." >&2; exit 1 ;;
          esac
          echo "analytics profile id: ${profile}"
          scripts/ci/verify-analytics-capture.sh "$profile"
