name: CI

on:
  push:
  pull_request:

# Issue #770. Cancellation is scoped to NON-DEFAULT refs, and the asymmetry is
# the whole point: on a PR branch a new push makes the previous run's answer
# worthless, so killing it is right; on `main` a new merge makes the previous
# run's answer the ONLY evidence that the merge before it was safe, so killing
# it destroys the one check standing between a bad merge and every branch cut
# afterwards.
#
# It had already stopped working. Of the last fourteen runs on `main`, twelve
# were `cancelled` and one succeeded — merges were landing minutes apart against
# a `Rust (openhuman, tinycortex)` lane that takes ~26 minutes, so each merge
# killed its predecessor's verification before it could conclude. The honest
# state of `main` across that stretch was neither known-good nor known-broken.
# Nothing was red; the signal simply was not there. Verification thinned out
# precisely when the merge rate made it most valuable, which is the property
# that makes this worse than a lane that is merely slow.
#
# `format('refs/heads/{0}', …default_branch)` rather than a literal
# `'refs/heads/main'`: the literal silently reverts to cancel-everything the day
# the default branch is renamed, and it would do so without failing anything —
# the same class of quietly-vacuous check this file exists to argue against.
# Both triggers populate `github.event.repository`, so the expression resolves
# on `push` and `pull_request` alike.
#
# PR runs are UNAFFECTED. A `pull_request` run's `github.ref` is
# `refs/pull/<n>/merge`, never `refs/heads/<default>`, so the expression is true
# there and stale runs still die on a new push.
#
# WHAT THIS DOES NOT BUY, stated plainly. Turning cancellation off does not give
# every merge its own conclusive run: the group still admits at most one running
# plus one pending run, and a newer arrival supersedes the older *pending* one.
# So the tip always eventually gets a full run, but a fast burst of merges loses
# individual attribution — a red run on the tip covers the union of merges since
# the last conclusive one, and finding which merge did it is a bisect. That is
# the deliberate trade: per-merge attribution costs a run per merge (a per-run
# group keyed on `github.run_id`, roughly 10x the minutes), and the alternative
# that is cheaper — an hourly scheduled run on `main` — tells you later and
# attributes the breakage to nothing at all. The structurally correct answer is
# a MERGE QUEUE, which verifies the exact merged state before it becomes `main`
# and makes this question moot; it needs a `merge_group` trigger plus a
# branch-protection change no PR can make, and with a 26–30 minute critical path
# it either serialises merges to ~2/hour or has to batch. Issue #793 carries that
# evaluation; this block is the fix that does not need anyone's settings.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

# Issue #251. Every cargo invocation below that resolves a dependency graph
# passes `--locked` (all of them except `cargo fmt`, which resolves nothing and
# does not accept the flag): CI must build the graph recorded in the committed
# `Cargo.lock` and fail loudly rather than re-resolve it in the runner. Without
# it, a `Cargo.toml` edit whose lock was never regenerated — or a `vendor/`
# submodule bump that moves a vendored crate's version — is absorbed silently,
# and a semver-compatible upstream release can change what CI compiles with no
# change to this repo, so a red run cannot be attributed to the diff.
#
# `--locked`, not `--frozen`. `--frozen` is `--locked` plus `--offline`, and
# these runners have no vendored registry — they must reach crates.io to
# download the crates the lock names. Pinning *resolution* and forbidding
# *downloads* are separate properties; only the first is wanted here.

# Issue #590. Every `uses:` in every workflow in this repo names a full commit
# SHA with the resolved version in a trailing comment, never a tag. A tag is a
# pointer its owner can move at any time, so a tag reference executes whatever
# the tag names at run time rather than the code that was reviewed when the job
# last passed — on our runners, with this workflow's token and secrets. It is
# the property `--locked` buys the cargo steps above, applied to the actions.
#
# `actions/*` ARE PINNED TOO, deliberately. First-party GitHub actions carry
# less risk than community ones, but the tag mechanics are identical: `v7` is a
# moving pointer that GitHub itself repoints on every patch release. The
# alternative rule — "pin community actions, trust first-party" — makes every
# future reviewer classify an action's owner correctly, and the middle of that
# distribution is exactly where the call is hardest: `aws-actions/*` and
# `docker/*` in the deploy workflow are vendor orgs, neither GitHub nor a lone
# maintainer. "Every `uses:` is a 40-hex SHA" is a rule a reader, a reviewer or
# a grep can check without knowing who owns what, which is why it is the rule
# here. The cost is bumps, and bumps are answered below.
#
# `dtolnay/rust-toolchain` call sites pass `toolchain:` EXPLICITLY. Under
# `@stable` the REF made that choice — dtolnay keeps a branch per toolchain,
# each with its own `action.yml` default. Pinned to a SHA the ref no longer
# expresses the selection to a reader (verified: at the SHA used below the
# default is still `stable`, so a bare pin behaves identically today), and a
# future re-pin copied from the `nightly` branch would swap compilers with
# nothing in the diff to show it. The input says out loud what the ref used to.
# That pin is a BRANCH head rather than a release tag — upstream publishes one
# `v1` tag, on a lineage a year behind `stable` — so it is the one pin here
# Dependabot is unlikely to bump. Re-resolve it from the `stable` branch by
# hand; never copy a SHA from another repo or another toolchain branch.
#
# Pins rot: an unbumped pin is a frozen, eventually-unpatched action, which
# trades one supply-chain risk for another. The `github-actions` ecosystem entry
# in `.github/dependabot.yml` is the other half of this — it turns each upstream
# release into a reviewable PR that moves the SHA and its version comment
# together, which is the point of pinning in the first place.
jobs:
  # The header above states an invariant. This job is what makes it one.
  #
  # A comment is a guard only for people who read it, and the evidence that
  # this one is not enough arrived before the sweep even merged: the `Desktop`
  # job below was written against the pre-sweep file and landed with three
  # unpinned references while this branch was open. The next such job will be
  # written the same way. A grep is the cheapest thing that says no.
  #
  # Deliberately dumb and deliberately not a third-party action — a pinning
  # gate that itself resolves an action at run time would be circular. It reads
  # every `uses:` line in every workflow and requires a 40-hex SHA. It cannot
  # tell a good SHA from a bad one; the version comment beside it is for
  # humans, and Dependabot is what keeps it honest.
  actions-pinned:
    name: Actions pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every `uses:` names a commit SHA
        run: |
          set -euo pipefail
          # Match the `uses:` value only, ignoring prose that mentions "uses:"
          # inside a comment. Anchored to the step form: optional list dash,
          # the key, then the reference.
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]*[^@]+@[0-9a-f]{40}([[:space:]]|$|#)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error title=Unpinned action::A \`uses:\` reference names a tag or branch rather than a 40-hex commit SHA. A tag is a pointer its owner can move, so the job would run whatever it names at run time. Resolve it with: gh api repos/<owner>/<action>/commits/<tag> --jq .sha — then record the precise version in a trailing comment." >&2
            echo "$unpinned" >&2
            exit 1
          fi
          count=$(grep -rhcE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ | paste -sd+ - | bc)
          # Zero would pass the check above while asserting nothing — the
          # failure mode issue #555 exists to remember.
          if [ "$count" -eq 0 ]; then
            echo "::error title=Pin check matched nothing::The grep selected zero \`uses:\` lines, so this job is green while checking nothing. The pattern or the workflow layout changed." >&2
            exit 1
          fi
          echo "$count \`uses:\` references, all pinned to a commit SHA."

      # Issue #592, and the same argument as the pin check above. The vendored
      # openhuman submodule init was copied into four jobs in this file and a
      # fifth in `release.yml`, ~340 lines apart here — far enough that a reader
      # edits one copy and never learns the others exist. The copies then
      # drifted: `release.yml` was missing `vendor/tinyhumans-sdk` and the
      # nested `tinycortex` init, which fails `cargo build --locked` outright at
      # manifest resolution. It stayed invisible only because that workflow is
      # `workflow_dispatch`-only and had never run. This job's header records
      # the general lesson — a comment is a guard only for people who read it,
      # and one failed to stop the `Desktop` job landing unpinned. A grep is the
      # cheapest thing that says no.
      #
      # The pattern is the inline-copy signature specifically: `git -C
      # vendor/<path> submodule update`. It deliberately does NOT match the
      # `Report vendored openhuman drift` step's `git -C vendor/openhuman
      # rev-parse|fetch|merge-base|rev-list` — a different command that belongs
      # inline — nor `deploy-staging.yml`'s root-level `git submodule update
      # --init`, which is a different shape fetching the top-level OpenHuman
      # checkout before the shared helper fills its nested vendor tree.
      - name: Vendored submodule init is not inlined
        run: |
          set -euo pipefail
          failed=0

          inlined=$(grep -rnE 'git[[:space:]]+-C[[:space:]]+vendor/[^[:space:]]+[[:space:]]+submodule[[:space:]]+update' \
            .github/workflows/ || true)
          if [ -n "$inlined" ]; then
            echo "::error title=Inlined vendored submodule init::A workflow initializes the vendored submodules inline, running a \`submodule update\` against a \`vendor/\` checkout. That init happens in exactly one place, scripts/ci/init-vendored-submodules.sh, which derives the crate list from the pinned vendor/openhuman/.gitmodules — call the script instead. Copies drift, and a lane missing a submodule then fails on its own while its siblings stay green." >&2
            echo "$inlined" >&2
            failed=1
          fi

          # Zero would pass the check above while asserting nothing — the
          # failure mode issue #555 exists to remember. A rename or a mass
          # delete must not leave this job green while checking nothing.
          #
          # Anchored to the whole `run:` line, so it counts CALL SITES and not
          # mentions. An unanchored search would match the prose in this very
          # step, which would make this check permanently and silently green —
          # the same vacuity it exists to catch.
          callers=$(grep -rlE '^[[:space:]]*run:[[:space:]]*scripts/ci/init-vendored-submodules\.sh[[:space:]]*$' \
            .github/workflows/ || true)
          if [ -z "$callers" ]; then
            echo "::error title=Submodule init script unreferenced::No workflow calls scripts/ci/init-vendored-submodules.sh, so the check above is green while guarding nothing. Either the script was renamed and this job was not updated, or the call sites were removed. Restore the call: \`run: scripts/ci/init-vendored-submodules.sh\`." >&2
            failed=1
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "Vendored submodule init is inlined nowhere and called from:"
          echo "$callers"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # `submodules: true` is not recursive, so the crates nested under
      # `vendor/openhuman` still have to be fetched. Required even for this
      # default (offline) build, where the `openhuman` feature is off:
      # `openhuman_core` is an optional path dependency, but Cargo reads every
      # path dependency's manifest during resolution regardless of features.
      #
      # The list of crates lives in the script and only there — add a submodule
      # under `vendor/openhuman` there, not here (issue #592). The script also
      # carries the rest of the reasoning, including why `tinyhumans-sdk` is in
      # the list despite having no `[patch]` entry (issue #499).
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      # Issue #499: say out loud how far the vendored pin has drifted.
      #
      # The pin reached 102 commits behind `openhuman` main with nothing
      # reporting it, because a submodule pointer is invisible to every other
      # check here: nothing fails until some symbol the pinned copy does not
      # have is finally needed, and by then the catch-up is a migration rather
      # than a pointer move. This step is the missing report.
      #
      # DELIBERATELY NON-FATAL. The distance is a function of how fast a
      # different repository moves, so failing on it would block PRs that have
      # nothing to do with the vendored tree — the drift is a thing to schedule,
      # not a thing to stop the line for. It is an annotation, which is what a
      # number nobody was tracking needs first. Turning it into a hard failure
      # past a ceiling is `exit 1` on the last branch, if this proves too quiet.
      #
      # `unknown` rather than a wrong number is the whole discipline here. A
      # network blip, a shallow submodule checkout with no reachable merge base,
      # or a renamed default branch must not fail a Rust job over a report — but
      # nor may any of them be reported as "up to date", which is the one answer
      # that would put this back to being invisible.
      #
      # Hence the ancestry gate before the count. `rev-list --count HEAD..main`
      # is 0 when the pin EQUALS main and also when the pin is AHEAD of it — a
      # pin bumped to an unmerged commit, or to a local branch, reads as "at
      # main" without ever being compared to it. Only a pin that is an ancestor
      # of the fetched ref can have its distance measured, so anything else is
      # `unknown`. The fetch is likewise gated: a failed fetch can leave a stale
      # FETCH_HEAD from an earlier step, and counting against that is worse than
      # not counting.
      - name: Report vendored openhuman drift
        run: |
          set -u
          pin="$(git -C vendor/openhuman rev-parse --short HEAD)"
          if git -C vendor/openhuman fetch --quiet --no-tags --depth 500 origin main \
            && git -C vendor/openhuman merge-base --is-ancestor HEAD FETCH_HEAD 2>/dev/null; then
            behind="$(git -C vendor/openhuman rev-list --count HEAD..FETCH_HEAD 2>/dev/null || echo unknown)"
          else
            behind=unknown
          fi
          if [ "$behind" = unknown ]; then
            echo "::notice title=Vendored openhuman drift::pin $pin — distance from openhuman main could not be computed: the fetch failed, or the pin is not an ancestor of main (ahead of it, or on a branch of its own)."
          elif [ "$behind" -eq 0 ]; then
            echo "vendor/openhuman is at openhuman main ($pin)."
          elif [ "$behind" -le 25 ]; then
            echo "::notice title=Vendored openhuman drift::pin $pin is $behind commit(s) behind openhuman main."
          else
            echo "::warning title=Vendored openhuman drift::pin $pin is $behind commits behind openhuman main. Past ~25 the catch-up stops being a pointer move — see issue #499, where it reached 102 and the reorg in between turned the bump into a migration."
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Issue #251. `--locked` on the compiling steps already fails a stale
      # `Cargo.lock` — but it fails inside `Clippy` or `Build`, under a step name
      # that says nothing about the lock, and in both jobs at once. This step is
      # the legible version of that failure: it resolves the graph and nothing
      # else, takes seconds, and is the first cargo invocation in the run, so a
      # lock that does not match `Cargo.toml` — or a vendored submodule bump
      # landed without the regenerated lock — is named as such before anything
      # compiles.
      #
      # A STEP, not a separate job, on purpose: a dedicated job would pay for a
      # second runner plus another submodule checkout — minutes of the run's
      # wall clock — to print a message this step prints for free. `cargo
      # metadata` reads the whole lock regardless of the feature selection, so
      # one invocation covers every feature set CI builds.
      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Issue #770. Every lane in this file pins an explicit feature set, and
      # cargo features are additive — so the DEFAULT FATE of a feature-gated test
      # is "compiled by `Check (--all-features)`, executed by nothing". Nothing
      # reports it: no lane goes red, no count reads zero, the test simply is not
      # selected. Six features had accumulated never-executed tests that way,
      # including the `sidecar` brain's whole offline end-to-end suite and two
      # OAuth secret-lifecycle tests in `app::types`.
      #
      # This is the same family as #475, #477, #555 and #592, every one of which
      # was found BY HAND after the fact. The steps added below fix the six known
      # cases; this one is what makes the seventh fail at the moment it is
      # introduced rather than months later. A new feature cannot merge until
      # someone writes down which lane runs its tests, or why none does.
      #
      # HERE, on `rust`, and after the lock check specifically: the script reads
      # `cargo metadata --locked` for its feature list — ground truth rather than
      # a Cargo.toml grep, which would miss the implicit feature of an optional
      # dependency named without `dep:` — so it needs this job's submodule
      # checkout to resolve the vendored path manifests, and it should run after
      # the step that names a stale lock as a stale lock.
      #
      # It compiles nothing and takes seconds, so it belongs on the fast default
      # lane where a classification mistake is reported early, not behind the
      # 26-minute gated compile.
      - name: Assert every feature has a test lane or a stated reason
        run: scripts/ci/assert-feature-lanes.sh

      # No `--locked` here, and none is owed: `cargo fmt` is a `rustfmt` wrapper
      # that never resolves the dependency graph, and `cargo-fmt` does not
      # accept the flag.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # The SQLite backend's conformance suite, which until now RAN NOWHERE.
      #
      # `src/store/sqlite.rs` calls every `assert_*` in `src/store/conformance.rs`
      # — isolation, append-only, monotonic seq, export totality, and the task /
      # workspace / fact / skill / inbox / usage / run / user / session ports —
      # 24 tests that read as the guarantee the backend is trustworthy. None of
      # them had ever executed. `cargo test` above omits `--features sqlite`, so
      # the module is not compiled into it; `rust-gated` pins
      # `openhuman,tinycortex`; and the one step that does compile this code,
      # `Check (--all-features)`, says so in its own comment: "compiling every
      # target is not running any of them". Three lanes touched the file and no
      # lane ran it.
      #
      # This is the same shape as issue #475 — a suite everyone reads as a gate,
      # gating nothing — in the one place it costs the most, because the desktop
      # client makes SQLite the primary store rather than an alternative.
      #
      # A STEP on this job, not a new one. A dedicated job pays for a runner, a
      # submodule checkout, a toolchain install and a cache restore — minutes
      # before it compiles anything — to run a suite that finishes in
      # milliseconds. The cost here is one recompile of the lib under a second
      # feature set; `rusqlite` vendors SQLite (`features = ["bundled"]`) so
      # there are no system packages to install and `Swatinem/rust-cache` keeps
      # the C amalgamation between runs.
      #
      # Scoped to `--lib store::sqlite` rather than a bare `cargo test --features
      # sqlite`: this step exists to run the backend's own suite, and rerunning
      # the other ~1600 default tests under a feature that does not change them
      # would double the job's test time for no coverage.
      - name: Test the SQLite backend
        run: cargo test --locked --features sqlite --lib store::sqlite

      # Issue #770. Two more suites in the shape the SQLite step above rescued:
      # gated behind a feature, compiled by `Check (--all-features)`, and run by
      # NOTHING. Both are offline and add no dependency this job does not already
      # build, which is why they ride the fast default lane rather than earning
      # jobs of their own.
      #
      # Through `run-scoped-suite.sh`, which asserts a NON-ZERO count. A filter
      # that stops matching prints `0 passed` and exits 0, so a lane added to run
      # a gated suite can report success having run none of it — the same defect
      # one level up. The count is what separates "everything passed" from
      # "nothing ran", exactly as the MongoDB job argues below.
      #
      # `sidecar` was OWED a lane rather than merely missing one, and this is
      # where the debt is paid. The feature gates fourteen tests that had never
      # run; twelve passed and the two offline end-to-end cases the feature's own
      # documentation advertises FAILED (the inference callback fired zero
      # times). Issue #800 has the diagnosis. It lands here rather than red
      # because a lane permitted to be red is the state #428 was filed about.
      #
      # It rides this job for the reason the two above do: `sidecar = []` in
      # Cargo.toml — no dependency, nothing to fetch, nothing to build that this
      # job does not already have. Putting it in the gated job instead would add
      # a feature compile to the ~26-minute lane that is already the repository's
      # critical path (#793), to buy nothing.
      #
      # `export`: the bundle round-trip. Only `pack_tar`/`unpack_tar` are gated,
      # so nine of the ten tests this selects already run at default features —
      # the tenth, `tar_pack_unpack_roundtrip`, is the one that never has. The
      # nine are re-run rather than filtered out because splitting them apart
      # would cost a second filter to save milliseconds on an already-compiled
      # tree.
      - name: Test the export bundle
        run: scripts/ci/run-scoped-suite.sh "export bundle" export store::export

      # `imap`/`smtp`: the mail surface. One gated test runs here today — the
      # RFC822 parser — and it is a parser, which is precisely the kind of code
      # that rots silently. `smtp` is compiled alongside deliberately: it carries
      # no gated test of its own yet (see scripts/ci/feature-lanes.txt), and
      # building both means a mail test added on either side has a lane already.
      #
      # `live_smoke::send_then_receive_roundtrip` stays `#[ignore]`d and is NOT
      # covered by this step. It dials a real mailbox with real credentials, so
      # it is one `--ignored` flag away from running in a lane that now compiles
      # it — and still executes nowhere. Issue #798 tracks giving it a mail
      # service container; until then, say so rather than imply otherwise.
      - name: Test the mail surface
        run: scripts/ci/run-scoped-suite.sh "mail (imap)" imap,smtp server::ops::imap

      # `sidecar`: the whole of `src/brain/sidecar/`, which the feature gates at
      # the `mod` declaration — the idiom that hid these fourteen tests from
      # every lane and from a casual grep alike. Through the wrapper like its
      # neighbours, and here the non-zero count is not ceremony: the filter is a
      # module path, the module is gated, and a `#[cfg]` moved one line would
      # make this select nothing and still exit 0 — which is the failure mode
      # that produced #800 in the first place, one level up.
      - name: Test the sidecar brain
        run: scripts/ci/run-scoped-suite.sh "sidecar brain" sidecar brain::sidecar

      # Issue #428. The `Console E2E` job drives a REAL host, so it needs a
      # binary. Building one over there would mean a second submodule checkout
      # and a second cold Rust compile — minutes of wall clock to produce a
      # thing this job has already very nearly built. `cargo test` above
      # compiled the same graph, so this step is a link and little else.
      #
      # The artifact, not a job-level cache: a cache is keyed on inputs and may
      # legitimately miss, and a missing binary here has to be a hard failure
      # rather than a silent rebuild somewhere it does not belong.
      - name: Build the host binary for the e2e lane
        run: cargo build --locked --bin opencompany

      - name: Upload the host binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencompany-debug-binary
          path: target/debug/opencompany
          # Consumed minutes later by one job in the same run and never again.
          retention-days: 1

  # Issue #555. The MongoDB backend's conformance suite, which until now RAN
  # NOWHERE — the same defect as the SQLite step above, in the backend that
  # carries the hosted product.
  #
  # `src/store/mongodb.rs` calls the same `src/store/conformance.rs` assertions
  # the SQLite step rescued: 20 tests over the task / workspace / fact / skill /
  # inbox / usage / run / user / session ports, plus isolation, append-only and
  # monotonic-seq. None had ever executed. `cargo test` omits `--features
  # mongodb`, `rust-gated` pins `openhuman,tinycortex`, and `Check
  # (--all-features)` compiles the module without running it — three lanes touch
  # the file, no lane ran it. `StorageKind::Mongodb` is what hosted tenants run,
  # so the one storage backend under the deployed product was the one with no
  # coverage, and `conformance.rs` is the only thing pinning the three backends
  # to answer identically.
  #
  # It had already drifted. The first green run of this job was not green: the
  # port contract reads a limit of zero as an empty page, `find().limit(0)` is
  # MongoDB's *no limit* sentinel, and `list_runs` returned the whole collection
  # where the fs and sqlite backends return nothing. See `FindLimit` in
  # `src/store/mongodb.rs` — a live inversion sitting behind a green pipeline,
  # which is the argument for this job stated better than the rest of this
  # comment states it.
  #
  # A JOB, not a step — a DEPARTURE from the SQLite step's reasoning, so:
  #
  # `services:` is declared per JOB. Actions has no per-step service container,
  # so "make it a step on `rust`" is not on the table; the container would have
  # to attach to the whole job. That costs more than it looks. The runner pulls
  # `mongo:7` and waits for its health check BEFORE the job's first step, so
  # fmt, clippy, the default test run, the SQLite step and the binary build all
  # start later — and `console-e2e` has `needs: rust` for that binary, which
  # puts the wait on the run's CRITICAL PATH to serve a suite none of those
  # steps touch. `rust` also has no `Swatinem/rust-cache`, so a second feature
  # set built there recompiles cold on every run, in front of everything.
  #
  # A separate job pays a runner, a checkout and a toolchain install, exactly as
  # the SQLite comment says — but pays them IN PARALLEL, where they are compute
  # rather than wall clock, and amortises the compile in its own cache keyed to
  # this feature set. The SQLite step's arithmetic held because its suite's cost
  # was ALL setup and it needed no server; a service container is setup that
  # cannot be shared no matter where it is declared. `rust-gated` is the in-repo
  # precedent for the same trade: a separate job so the fast default lane keeps
  # its turnaround and its `Rust` check name for branch protection.
  #
  # Scoped to `--lib store::mongodb` for the SQLite step's reason exactly: this
  # lane runs the backend's own suite, and rerunning the ~1800 default tests
  # under a feature that does not change them would buy no coverage.
  #
  # On EVERY PR, not behind a `paths:` filter on `src/store/**`. The failure
  # guarded here is a port change that breaks one backend's implementation, and
  # the author of such a change need never open `src/store/mongodb.rs` — a path
  # filter would skip this lane on exactly the diff that most needs it.
  rust-mongodb:
    name: Rust (mongodb)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # The health check is the handshake, not decoration: steps begin as soon
        # as the container is STARTED, and `mongod` accepts TCP before it will
        # answer a command. Without this the first test races startup, and the
        # driver's own server-selection retry would turn that into a 30s stall
        # ending in a timeout rather than a legible failure.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Same reason as the `rust` job: `tinyhumans-sdk` is an unconditional path
      # dependency of the vendored openhuman crate (issue #499), so Cargo reads
      # its manifest during resolution even where the feature selection excludes
      # `openhuman`. A missing checkout fails THIS build too, not just a gated
      # one. `submodules: true` is not recursive, hence the explicit init.
      #
      # The script derives the crate list from the pinned
      # `vendor/openhuman/.gitmodules` (issue #592) — nothing here holds a copy.
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # TWO different silent-success modes are guarded below, and neither guard
      # catches the other's failure. Both are needed.
      #
      # `OPENCOMPANY_TEST_MONGODB_REQUIRED=1` turns "no server" from a skip into
      # a panic (see `required()` in `src/store/mongodb.rs`). The suite's local
      # default is to skip when `OPENCOMPANY_TEST_MONGODB_URI` is unset, which
      # rightly keeps a laptop's `cargo test` offline — and which, left in place
      # here, lets this job report `20 passed` in 0.00s having connected to
      # nothing. That is measured, not hypothetical: it is what the suite does
      # on this runner today, and reproducing it inside the lane built to end it
      # would just move the bug one layer down.
      #
      # The count assertion catches the mode `REQUIRED` cannot. If the
      # `store::mongodb` filter stops matching — module renamed, moved, or
      # feature-gated away — cargo selects zero tests, prints `0 passed; 0
      # failed` and exits 0, and `required()` never runs because `store()` is
      # never called. Only a NUMBER separates "everything passed" from "nothing
      # ran"; issue #481 established the same assertion for integration targets.
      #
      # `scripts/ci/assert-integration-targets-run.sh` is NOT reused: it walks
      # the `[[test]]` targets `cargo metadata` reports — the files under
      # `tests/` — and this suite is a `--lib` unit module it does not select.
      # Same defect class, different target kind, so the count is read straight
      # off cargo's summary line instead.
      - name: Test the MongoDB backend
        env:
          OPENCOMPANY_TEST_MONGODB_URI: mongodb://localhost:27017
          OPENCOMPANY_TEST_MONGODB_REQUIRED: "1"
        run: |
          set -euo pipefail
          cargo test --locked --features mongodb --lib store::mongodb \
            | tee "${RUNNER_TEMP}/mongodb-suite.log"
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' \
            "${RUNNER_TEMP}/mongodb-suite.log" | head -n 1)
          if [ -z "${passed}" ] || [ "${passed}" -eq 0 ]; then
            echo "::error title=MongoDB suite ran nothing::cargo reported no passing tests for --lib store::mongodb, so this job is green while asserting nothing about the backend hosted tenants run. The filter selects no tests — see issue #555." >&2
            exit 1
          fi
          echo "MongoDB backend suite: ${passed} tests passed."

      # Issue #770. The step above pins `--lib store::mongodb`, and there is one
      # `mongodb`-gated test that lives OUTSIDE that module:
      # `store::select::mongodb_selection_requires_uri`, which asserts that
      # selecting the Mongo backend without a URI is an error rather than a
      # silent fallback. The filter above cannot reach `store::select`, no other
      # lane enables `mongodb`, and `Check (--all-features)` only compiles it —
      # so it ran nowhere.
      #
      # This is the #555 comment above happening a second time to the same
      # feature, one module over: a filter that is right about the module it
      # names says nothing about the module it does not. The classification
      # table records `store::select` alongside `store::mongodb` for exactly this
      # reason, and `assert-feature-lanes.sh` fails if either filter stops
      # appearing here.
      #
      # It needs no server (it asserts the failure BEFORE connecting), so it
      # rides this job for the feature build rather than earning one of its own.
      - name: Test the MongoDB storage selection
        run: scripts/ci/run-scoped-suite.sh "mongodb selection" mongodb store::select

  # Issue #202. The `Rust` job above builds DEFAULT FEATURES ONLY, so every line
  # behind `openhuman` (`src/harness/**`, `src/workflows/**`, `src/runtime/`
  # `delegation*`, and the `live_company_turn` example) and every line behind
  # `tinycortex` (`src/store/tinycortex_engine.rs` plus its `src/store/select.rs`
  # seam) is invisible to it — a green `Rust` check is not evidence for a diff
  # whose lines are all feature-gated. That blind spot let a hard `E0062` in a
  # test `HarnessDeps` literal and a failing harness test both sit on `main`.
  # This job compiles, lints and tests that surface.
  #
  # Deliberately a SEPARATE job rather than extra steps on `rust`: the fast
  # default check keeps its ~3-minute turnaround and its `Rust` check name (any
  # branch-protection rule pinned to it is unaffected), and the two run in
  # parallel.
  #
  # One combination, not a matrix. Cargo features are additive, and `tinycortex`
  # adds no new compilation on top of an `openhuman` build — the crate is already
  # an unconditional dependency of `openhuman_core` — so `openhuman,tinycortex`
  # covers both rot areas in a single compile. A default/`openhuman`/
  # `openhuman,tinycortex`/`--all-features` matrix would roughly triple CI
  # compute for a sliver of extra coverage.
  rust-gated:
    name: Rust (openhuman, tinycortex)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # OpenHuman's agent loop requires the same stack its production runtimes
      # allocate. Apply it to every test invocation in this multi-feature job;
      # Rust's test harness otherwise creates 2 MiB threads.
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Identical to the `rust` job's init, and for the same reason: `submodules:
      # true` is not recursive. This lane is the one that actually compiles the
      # nested graph rather than only resolving it, `--features openhuman`
      # reaching every vendored crate the pin declares, plus tinycortex's own
      # `tinyagents`.
      #
      # The script derives that list from the pinned
      # `vendor/openhuman/.gitmodules` (issue #592), and documents why the init
      # is scoped to the `vendor/` prefix rather than `--recursive`.
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      # `--features openhuman` links system libraries the default build does not.
      # Mirrors the builder stage of the repo `Dockerfile`: OpenSSL headers
      # (native-tls → openssl-sys, via `motosan-ai-oauth` → `hyper-tls` in the
      # vendored openhuman tree) and the X11 dev libs that openhuman's
      # unconditional `rdev`/`arboard` deps link against even in a headless
      # build. Pinning them here keeps the job immune to runner-image drift; the
      # step is idempotent and costs well under a minute.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxi-dev libxtst-dev libxrandr-dev libxcb1-dev libxkbcommon-dev

      # clippy only: `rustfmt` is feature-independent, so formatting stays fully
      # covered by the `rust` job and re-running it here would buy nothing.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Steps are ordered to fail fast and cheap: a compile break (the `E0062`
      # class of bug that motivated this job) surfaces before the lint pass
      # spends time on a tree that does not build.
      - name: Build (openhuman, tinycortex)
        run: cargo build --locked --features openhuman,tinycortex --all-targets

      # `--no-deps` is LOAD-BEARING — do not "simplify" it away. Cargo treats the
      # vendored `[patch]` crates as local packages, so an unscoped `-D warnings`
      # hard-fails on lints this repo neither owns nor can fix here (today:
      # `large_enum_variant` in OpenHuman's nested `vendor/tinyagents`), and the
      # gate would never reach first-party code. Scoping to the primary package
      # is what makes it meaningful.
      - name: Clippy (openhuman, tinycortex)
        run: cargo clippy --locked --no-deps --features openhuman,tinycortex --all-targets -- -D warnings

      # `--tests` is LOAD-BEARING IN BOTH DIRECTIONS. Do not narrow it back to
      # `--lib`, and do not widen it to a bare `cargo test`.
      #
      # Issue #475, why not `--lib`. `--lib` selects the library's unit tests and
      # nothing else, so every integration target under `tests/` is excluded from
      # this job — and this is the only job that has the features those targets
      # need. The `Rust` job does select them (a bare `cargo test` includes
      # `tests/`), but at DEFAULT features, where `one_card_per_message.rs`'s
      # `#![cfg(feature = "openhuman")]` empties the file. One job had the
      # feature and not the target, the other had the target and not the feature,
      # so the 11-case suite that proves one operator message opens exactly one
      # card (#463/#466) was built by nothing and ran nowhere: `cargo test
      # --locked --test one_card_per_message` reported `0 passed`. A revert of
      # the fix it guards would have been caught by no check in this file.
      #
      # This step's stated justification used to be "there is no `tests/`
      # directory". That was a FACT ABOUT THE TREE, and #466 falsified it the day
      # it merged, silently — nothing fails when a comment stops being true. The
      # reason below is a property of the target selection instead, so it cannot
      # expire the same way.
      #
      # Why not a bare `cargo test`: its default selection additionally runs the
      # library's DOCTESTS, a distinct compile and link of the whole tree under
      # this feature set for coverage the `rust` job's `cargo test` already
      # provides, and it builds every example — including `live_company_turn`,
      # whose `required-features = ["openhuman"]` this lane satisfies and which
      # exists to dial a real inference backend with a real credential. `--tests`
      # selects exactly the targets that assert: the lib and bin unit tests, plus
      # every integration target under `tests/`, present and future.
      - name: Test (openhuman, tinycortex)
        run: cargo test --locked --features openhuman,tinycortex --tests

      # The guard for the next one (issue #475). The step above runs whatever
      # `tests/` holds, but "ran the target" and "the target ran anything" are
      # different claims: a file whose crate-level `cfg` is not satisfied still
      # builds, still links, and still exits 0 having executed nothing. That is
      # exactly how a whole suite sat in the tree for weeks looking like
      # coverage. This asserts a NUMBER per integration target, so the silent
      # zero becomes a red check, and prints the counts into the run log.
      # The runner lane: identity, attestation, presence and dispatch. Behind
      # its own feature, so `cargo test` at default features compiles none of
      # it and the gated lane above pins `openhuman,tinycortex` — without this
      # step the whole surface would be built by `Check (--all-features)` and
      # RUN by nothing, which is issue #475's exact pathology and the one S0
      # found already live in the SQLite backend.
      - name: Test the runner lane
        run: cargo test --locked --features runner --lib runner

      # The ACP surface, for the same reason and with the same shape. Both
      # modules document themselves in terms of a feature that did not exist
      # until now, so they compiled into every build and were run by no lane —
      # and served by no route either, since nothing mounts them yet.
      # Two invocations, not one: `--lib` selects the target and the bare
      # argument is the filter, so a second filter would be read as a flag
      # rather than as another module — and would silently narrow to nothing.
      - name: Test the ACP surface
        run: |
          cargo test --locked --features acp --lib server::acp
          cargo test --locked --features acp --lib harness::acp_run_turn

      # Issue #788: Chargebee billing — the REST layer (`chargebee::`) and the
      # toolbelt bridge (`harness::chargebee`) in one filter, which selects both.
      # It runs HERE rather than on the fast default job because the bridge lives
      # under `src/harness/` and so compiles only with `openhuman`; splitting it
      # across two lanes would need two rows in feature-lanes.txt for one
      # feature, which that table rejects. All of it is offline: the wire tests
      # drive a stub on an ephemeral port and the rest never build a request.
      - name: Test the Chargebee billing integration
        run: scripts/ci/run-scoped-suite.sh "chargebee" openhuman,tinycortex,chargebee chargebee

      # Issue #789: PayPal. Here rather than on the fast default job for the same
      # reason as chargebee above — the toolbelt bridge is under `src/harness/`
      # and so needs `openhuman`. It USED to ride the default job on `--features
      # paypal` alone, which reached `company::paypal` and `paypal::` and could
      # not compile `harness::paypal` at all: those tests existed and no lane ran
      # them, which is exactly the #770 pathology this table exists to stop. One
      # lane with the gated feature set selects all three. Offline: the token
      # cache and error tests drive a stub on an ephemeral port.
      - name: Test the PayPal integration
        run: scripts/ci/run-scoped-suite.sh "paypal" openhuman,tinycortex,paypal paypal

      - name: Assert every integration target actually runs
        run: scripts/ci/assert-integration-targets-run.sh openhuman,tinycortex

      # Issue #579: the offline claim, executed rather than asserted.
      #
      # `sudo unshare -n` puts the test binary in a fresh network namespace: no
      # routes, no DNS, no interfaces but the loopback this brings up. An
      # accidental cloud call on a shared code path is therefore a RED BUILD
      # here, which is the whole point — a lane that merely declines to
      # configure cloud providers passes just as happily when something dials
      # out on a path the test did not reach.
      #
      # Why not the alternatives. `iptables -P OUTPUT DROP` would also cut the
      # Actions runner's own control connection to the service, and a container
      # with `--network none` needs an image built for the purpose; the
      # namespace needs neither and the binary is already on disk.
      #
      # BUILT FIRST, DELIBERATELY. `--no-run` compiles (and therefore fetches)
      # while the network still exists; only the execution is sandboxed. A
      # namespace around `cargo test` would fail on the registry, not on the
      # code, and would say nothing about the runtime.
      #
      # `OPENCOMPANY_OFFLINE_LANE=1` is what arms the guard's own self-check —
      # `a_deliberate_outbound_call_fails_inside_the_namespace` asserts that
      # egress FAILS. Without it a sandbox that silently failed to apply would
      # produce a green lane indistinguishable from a working one, and "nothing
      # dialled out" could not be told from "the jail was never locked".
      - name: Build the offline end-to-end target
        run: cargo test --locked --features openhuman,tinycortex --test offline_e2e --no-run

      - name: Run it with no network at all
        run: |
          set -eu
          binary="$(cargo test --locked --features openhuman,tinycortex --test offline_e2e \
            --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.executable != null and (.target.name == "offline_e2e")) | .executable' \
            | tail -n 1)"
          test -n "$binary" || { echo "could not locate the offline_e2e test binary" >&2; exit 1; }
          echo "running $binary inside a network namespace"
          sudo --preserve-env=RUST_MIN_STACK,OPENCOMPANY_OFFLINE_LANE \
            unshare --net -- sh -c "ip link set lo up && exec '$binary' --test-threads=1 --nocapture"
        env:
          OPENCOMPANY_OFFLINE_LANE: "1"

      # Catches the combination traps no single feature set can: most often a
      # mandatory struct field constructed differently across feature arms.
      #
      # `--all-targets` is LOAD-BEARING (issue #288). Without it this step
      # checks the lib and bins only, so test code behind a storage feature is
      # compiled by NOTHING in CI: the default `rust` job runs `cargo test`
      # without `sqlite`, and the gated steps above pin `openhuman,tinycortex`.
      # That gap let two `E0034`s in `src/store/sqlite.rs`'s own tests sit on
      # `main` unseen — a green check is only evidence for the surface it
      # actually compiles.
      #
      # CHECK-ONLY BY DESIGN — compiling every target is not running any of
      # them. This step must never become `cargo test`: `--all-features` also
      # enables `mcp`, which changes what an agent's tool belt *contains*, and
      # that contract is pinned by the dedicated narrow step below.
      - name: Check (--all-features)
        run: cargo check --locked --all-features --all-targets

      # The tool belt the SHIPPED tenant image actually builds (issue #297).
      #
      # Every other lane here runs `openhuman[,tinycortex]`. `mcp` is the one
      # feature that changes what an agent's tool belt *contains* rather than
      # only what compiles, so no lane exercised the belt real deployments get —
      # and `dispatched_desk_agent_tool_belt_is_pinned` was failing unseen on
      # `main` for exactly that reason. The pin is now feature-aware, so it is
      # correct under every combination; this step is what keeps that true.
      #
      # Deliberately NARROW. This feature set is a fourth distinct compile of the
      # tree, so it runs only the belt-contract module rather than the whole
      # suite: those tests are the entire reason the combination matters, and
      # everything else in `--lib` is already covered by the step above. Widen it
      # only if a second behavioural feature-divergence shows up.
      #
      # `--locked` per issue #251's rule for every graph-resolving invocation:
      # this is a fourth distinct feature resolution, so without it this lane
      # would be the one place CI silently re-resolves the dependency graph.
      # `+media` since issue #770, and the widening is the point rather than a
      # tidy-up. `media` gates two tests — the belt's media-namespace mapping in
      # `harness::build` and the tool-name/namespace pin in `harness::toolbelt` —
      # and BOTH were compiled by `Check (--all-features)` and run by nothing.
      # Adding the feature to the set this step already builds runs the first at
      # no extra compile; the second needs its own filter, below, because
      # `harness::build::tests` does not reach `harness::toolbelt`.
      #
      # These tools spend real money (`media_generate_image` / `_video` against a
      # MANAGED platform credential), and what they are gated on is the belt
      # entry that decides whether an agent can reach them at all. An unrun
      # namespace pin is the wrong thing to have never executed.
      - name: Test tool-belt contract (openhuman, mcp, telegram, media)
        run: scripts/ci/run-scoped-suite.sh "tool-belt contract" openhuman,mcp,telegram,media harness::build::tests

      # The `media` toolbelt's other half: the three tool names and their single
      # `media` namespace. Same feature set as the step above, so this costs a
      # filtered re-run of an already-compiled tree and no fourth resolution.
      - name: Test the media toolbelt
        run: scripts/ci/run-scoped-suite.sh "media toolbelt" openhuman,mcp,telegram,media harness::toolbelt

      # The `mcp` OAuth-flow state, which the belt filter above never reached.
      # `app::types` holds two gated tests — a parked flow is SINGLE-USE (a
      # replayed callback finds nothing) and it EXPIRES, with a sweep on park so
      # an abandoned flow's client secret cannot outlive its TTL even if nobody
      # ever takes it. Both are secret-lifetime invariants, both were run by
      # nothing, and neither is the sort of property to discover is broken from a
      # production incident.
      #
      # A separate invocation, not a second bare argument on the step above: the
      # first bare argument is the filter and a second would narrow the selection
      # to nothing — the trap the ACP step already documents, and the reason
      # `run-scoped-suite.sh` takes exactly one filter.
      - name: Test the MCP OAuth flow state
        run: scripts/ci/run-scoped-suite.sh "mcp oauth state" openhuman,mcp,telegram,media app::types

      # Issue #770. `composio` gated TWENTY-FOUR tests that ran nowhere — the
      # largest single pocket found. `src/harness/composio_catalog.rs` says so in
      # its own doc comment ("the live tools are behind `composio`, which CI
      # never *runs*"), which is a fact about this file that nothing enforced.
      #
      # What was unrun is not incidental: per-tenant ISOLATION (each tenant only
      # ever carries its own token; a rotated token is scrubbed per call; an
      # error body reflecting the token is scrubbed), the allowlist refusals that
      # happen BEFORE any network call, and the end-to-end proof that an agent
      # discovers and calls an action unaided across two large toolkits. Tenant
      # token isolation is the property that keeps one company out of another's
      # Gmail; it had no runner.
      #
      # All offline — the Composio backend is scripted in every one of them.
      #
      # `openhuman,tinycortex,composio` rather than a bare `--features composio`
      # (which would imply `openhuman` anyway): matching this job's own set means
      # the vendored tree is already built and only this crate recompiles.
      # `composio` adds no `openhuman_core/*` subfeature, so there is no vendored
      # rebuild at all.
      #
      # TWO NARROW FILTERS RATHER THAN THE BARE WORD `composio`, which would be a
      # substring match sweeping every composio module at once. That wider
      # selection is what this lane should eventually be, and it cannot be yet:
      # of the 24, two FAIL. `server::ops::composio::tests::an_admin_is_unaffected`
      # dials `api.tinyhumans.ai` for real once the feature is on (it passes today
      # only because the un-gated stub stands in), and the scripted two-toolkit
      # turn reaches neither provider. Issue #801 has both diagnoses; the wider
      # filter lands with the fix, not as a red lane (#428).
      #
      # These two groups are chosen because they are the ones whose silence cost
      # the most. `isolation_tests` is per-tenant token isolation — each tenant
      # only ever carries its own token and sees its own accounts, a rotated
      # token is scrubbed per call, an error body reflecting the token is
      # scrubbed. That is the property keeping one company out of another's
      # Gmail, and it had no runner at all. `ops_helper_tests` is the allowlist
      # refusals that must happen BEFORE any network call, plus the catalog and
      # connection projections.
      #
      # Separate invocations, each with its own asserted count, for the reason
      # the ACP step above states: the first bare argument is the filter and a
      # second would narrow the selection to nothing.
      - name: Test Composio tenant isolation
        run: scripts/ci/run-scoped-suite.sh "composio isolation" openhuman,tinycortex,composio harness::composio::isolation_tests

      - name: Test the Composio ops helpers
        run: scripts/ci/run-scoped-suite.sh "composio ops helpers" openhuman,tinycortex,composio harness::composio::ops_helper_tests

      # Issue #820 — which connected account an agent acts as. A third narrow
      # filter for the same reason the two above are narrow, and the same reason
      # they exist at all: these assert on the `composio_execute` REQUEST BODY —
      # that an unpinned toolkit still carries no connection id, and a pinned one
      # carries the operator's. Both are decidable only under `composio`, so
      # without a lane they would be twenty-four's worth of silence again, and
      # the negative half is the one protecting every existing single-account
      # company from having its account resolution changed.
      - name: Test which Composio account an execute acts as
        run: scripts/ci/run-scoped-suite.sh "composio account choice" openhuman,tinycortex,composio harness::composio::live::live_tests

      # Issue #820 — a fourth narrow filter, and the first outside `harness::`.
      # The console-plane half of the same decision: the grouping the choice is
      # reported through, and the cleanup that drops a choice naming an account
      # Composio no longer lists. Both are gated on `composio`, so before this
      # step they were compiled by `Check (--all-features)` and run by nothing.
      #
      # `…::tests::gated_tests` and not `server::ops::composio`, which would
      # sweep in `an_admin_is_unaffected` — the one that dials
      # `api.tinyhumans.ai` for real once the feature is on (#801). The module
      # exists to be nameable here: a gated ops test added later joins it and is
      # run, rather than depending on somebody remembering this file.
      - name: Test the Composio account choice on the console plane
        run: scripts/ci/run-scoped-suite.sh "composio choice ops" openhuman,tinycortex,composio server::ops::composio::tests::gated_tests

      # Issue #914. The `tinymemory` feature binds the engine-neutral
      # `MemoryProvider` contract and adds the `remote`/`null` selection modes.
      #
      # Both steps pass `tinymemory` ALONE, deliberately. The feature does not
      # imply `tinycortex` and must not be made to: `remote`/`null` bind a
      # provider through this contract while `embedded` uses the `tinycortex`
      # overlay, and keeping them apart is what lets a hosted-memory tenant build
      # without linking a bundled SQLite it will never call (tinymemory#18 §D).
      # Adding `tinycortex` here to "make the build match the lane" would hide a
      # regression in exactly that separation, because the contract path would
      # never again be compiled on its own.
      #
      # The lane is a placement choice, not a requirement — every Rust job runs
      # `init-vendored-submodules.sh`, so the `vendor/openhuman/vendor/tinymemory`
      # path deps resolve in all of them.
      #
      # Two steps because `run-scoped-suite.sh` takes exactly one filter each, and
      # both halves need to run: `store::memory` covers the decorator's
      # tenant-isolation and archive-on-evict properties, and `store::select`
      # covers the boot refusals that keep a misconfigured hosted engine from
      # starting.
      - name: Test the TinyMemory provider contract
        run: scripts/ci/run-scoped-suite.sh "tinymemory contract" tinymemory store::memory

      - name: Test the memory engine selection surface
        run: scripts/ci/run-scoped-suite.sh "tinymemory selection" tinymemory store::select

      # Issue #477. Before this step, `tinyplace` was COMPILED by CI and
      # EXECUTED by nothing. `Check (--all-features)` above builds every
      # `tinyplace`-gated line and deliberately runs none of them, and no other
      # `cargo test` line in this file names the feature — so the whole gate was
      # covered for compilation and not at all for behaviour, and a logic defect
      # behind it shipped green. Those are different claims, and only the second
      # one is what a test suite is for: `src/economy/outbox.rs` carries a
      # passing round-trip test for `Outbox::drain()` whose only caller in the
      # entire tree is that test's own module (#454). Nothing ever ran the
      # assertion, so nothing pointed out that the production drain it describes
      # does not exist.
      #
      # FULL `--lib`, not a module filter — and this is the substance of the
      # step, not a detail of it. `tinyplace` gates code across the tree, not
      # just the economy adapter and its crypto primitives: company config, the
      # runtime builder's economy wiring (in BOTH the `cfg` and the `cfg(not)`
      # arm), the A2A server surface and the route that mounts it, and the
      # platform-split key paths under `src/store/`. Narrowing to `economy::`
      # would leave every one of those compiled and never run, which is the
      # precise condition this step exists to end.
      #
      # The narrow shape of the belt-contract step above does NOT transfer here.
      # That one is scoped because `mcp` changes what a tool belt *contains* and
      # a single module pins that contract, so the rest of the run would be
      # re-proving what an earlier lane already proved. `tinyplace` is the
      # `openhuman,tinycortex` shape instead — a feature that changes behaviour
      # at every site it gates — and that lane runs its whole suite for the same
      # reason. The compile is what this costs; the compile is identical either
      # way, so a filter would only discard results already paid for.
      #
      # `--lib` rather than `--tests` because no integration target under
      # `tests/` carries a crate-level `cfg` on `tinyplace`; `--tests` would
      # link an extra binary this feature set leaves empty. That does not
      # reopen #475's hole. If such a target is ever added, `Assert every
      # integration target actually runs` above fails it with `0 tests`, because
      # that assertion sweeps EVERY target in the manifest whatever gates it —
      # which is also why that script is not repeated here: on a lane without
      # `openhuman` it would have to fail by design.
      #
      # A STEP on this job, not a fifth job: the vendored-submodule init and the
      # system build dependencies this job already installs are exactly what
      # this compile needs, and a separate job would repeat both plus a cold
      # Rust cache to run a suite that finishes in seconds. Placed last so the
      # cheaper cached steps still fail first. Split it out if this job's wall
      # clock ever becomes the constraint — that is a pure CI-shape change with
      # no argument riding on it.
      #
      # `--locked` per issue #251's rule for every graph-resolving invocation:
      # this is a fifth distinct feature resolution, and without it this lane
      # would be the one place CI silently re-resolves the dependency graph.
      - name: Test (tinyplace)
        run: cargo test --locked --features tinyplace --lib

      # Issue #467. The `Console E2E (live brain)` job below drives a host that
      # has an agent harness, so it needs a FEATURE-GATED binary — the default
      # one the `rust` job uploads answers a chat message with nothing, which is
      # why four of the suite's best specs were skipped rather than run.
      #
      # Here rather than in that job, for the same reason #428 put the default
      # binary in `rust`: building it over there would mean a second submodule
      # checkout, a second apt install and a second cold compile of the vendored
      # openhuman tree, minutes of wall clock for a thing this job has already
      # very nearly built.
      #
      # `mcp` on top of the job's own `openhuman,tinycortex`, because
      # `mcp-agent.spec.ts` needs the `mcp_call_tool` belt entry, which is gated
      # on it. That is another feature resolution, but a cheap one: the
      # belt-contract step above already compiled `openhuman_core` with
      # `openhuman_core/mcp` enabled, so what recompiles here is this crate plus
      # its bin, not the vendored tree.
      #
      # `composio` on the same grounds as `mcp`, and for one spec:
      # `composio-account-choice.spec.ts` asserts WHICH connected account an
      # agent acts as (issue #820), and `composio_execute` exists on a belt only
      # under this feature. Without it the spec would skip — which is how the
      # four specs #467 rescued came to sit unrun for months. Cheap for the same
      # reason: `composio` adds no `openhuman_core/*` subfeature, so the
      # vendored tree does not rebuild.
      #
      # `--bin`, not `--all-targets`: the lane needs a binary, and the tests and
      # examples under this feature set are already covered above.
      - name: Build the gated host binary for the live-brain e2e lane
        run: cargo build --locked --features openhuman,tinycortex,mcp,composio --bin opencompany

      - name: Upload the gated host binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencompany-gated-binary
          path: target/debug/opencompany
          # Consumed minutes later by one job in the same run and never again.
          retention-days: 1

  # Issue #281. Both jobs above are Rust-only, so before this job existed NOTHING
  # in CI installed Node: `frontend/` was invisible to the entire build, and a
  # TypeScript error there passed every required check and merged. The first
  # thing that noticed a broken console was `deploy-staging.yml`, which runs
  # AFTER merge, or a person. Same shape as the #202 blind spot the `rust-gated`
  # job above closed, with more force — that one hid a subset of the build, this
  # one hid a whole language.
  #
  # `tsconfig.app.json` sets `noUnusedLocals` and `noUnusedParameters`, so the
  # failure modes are easy to hit: dropping an argument from a helper is enough.
  #
  # A THIRD TOP-LEVEL JOB, appended after `rust-gated` rather than folded into
  # either: it shares no setup with them (no submodules, no system packages, no
  # toolchain), it runs in parallel so it adds nothing to the critical path, and
  # it gets its own `Console` check name for branch protection to pin.
  console:
    name: Console
    runs-on: ubuntu-latest
    # A minute of real work. The cap exists only so a wedged registry fetch fails
    # in ten minutes instead of burning the runner's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # No `submodules` — unlike the Rust jobs this one resolves no vendored
          # manifests, and `vendor/openhuman` is a large checkout to skip.

      # Issue #858. `node-version-file`, NOT a literal — `frontend/.nvmrc` is
      # the single place the console's Node version is written, and this is one
      # of four jobs that used to hold their own copy of `22`. A literal here
      # is a copy that can silently disagree with the one a contributor runs.
      #
      # It still tracks `frontend/Dockerfile`, which builds the shipped console
      # `FROM node:22-slim`. CI must compile on the version that produces the
      # artifact; that file cannot read `.nvmrc`, so those two are the only pair
      # left to bump together — and the Dockerfile carries a comment saying so.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, NOT `npm install` — do not "simplify" this. It is the npm half
      # of the same property `--locked` buys the cargo steps above (issue #251):
      # it installs strictly the tree recorded in `package-lock.json` and exits
      # non-zero when the lock and `package.json` disagree, so a manifest edit
      # whose lock was never regenerated is named here rather than absorbed.
      # `npm install` would silently re-resolve and REWRITE the lock in the
      # runner, which means CI would be typechecking a dependency tree that is
      # not the one committed — and a green run could not be attributed to the
      # diff. It is also the command `frontend/Dockerfile` uses.
      - run: npm ci
        working-directory: frontend

      # Three steps, not one, because each catches something the others do not
      # and a separate step names the failure.
      #
      # `typecheck` is `tsc -b`: fails fast on `src/` types.
      - run: npm run typecheck
        working-directory: frontend

      # `typecheck:e2e` covers `frontend/test/e2e/` and `playwright.config.ts`,
      # which `tsc -b` does NOT reach — `tsconfig.app.json` is `include: ["src"]`
      # — so before this the Playwright specs were compiled by nothing at all.
      # See the header of `frontend/tsconfig.e2e.json`. It still does not RUN
      # the suite; the `Console E2E` job below does that now (issue #428).
      - run: npm run typecheck:e2e
        working-directory: frontend

      # Issue #434. Same argument one directory over: `tsconfig.app.json` and
      # `tsconfig.e2e.json` between them reach `src` and `test/e2e`, and nothing
      # reached `test/unit`. Vitest strips types rather than checking them, so
      # without this step a unit test could call a helper with the wrong arity
      # and go green by coincidence — a test that cannot fail correctly is worse
      # than no test, because it reports coverage.
      - run: npm run typecheck:unit
        working-directory: frontend

      # The unit suite itself (issue #434). Sub-second, so it costs this job
      # nothing and there is never a reason to reach for `--no-verify` around
      # it. `npm test` is `vitest run`, NOT bare `vitest` — the bare form is a
      # WATCHER and would hang the runner until the job timeout.
      #
      # This is the first step in CI that can prove a console function returns
      # the right answer. `typecheck` and `build` prove the code compiles; a
      # helper that maps A to the wrong B compiles perfectly.
      - run: npm test
        working-directory: frontend

      # `build` runs `tsc -b` again but then invokes Vite, which additionally
      # catches a module-resolution or plugin failure that type-checking alone
      # never sees — a bad `@/` import or a missing asset builds a green `tsc`
      # and a broken bundle.
      - run: npm run build
        working-directory: frontend

      # The design system's token layer, asserted rather than trusted.
      #
      # 192 arbitrary font sizes, 87 raw palette colours and 26 stray hexes
      # were cleared in one pass; without a guard they come back one
      # convenient exception at a time, and each one is a value the system
      # cannot see, theme, or change later. The script explains each rule and
      # names the token to use instead, so a failure is self-service.
      #
      # Not part of `build`: this is a policy check, and a separate step names
      # the failure as one. See docs/design-system/README.md.
      - run: ./scripts/ci/assert-design-tokens.sh

      # The 500-line Markdown cap, asserted rather than trusted (issue #695).
      #
      # `CLAUDE.md` has stated the rule since the beginning and nothing measured
      # it, so three files drifted past — one to 699 lines — a paragraph at a
      # time. Same family as the check above: a policy grep, no toolchain
      # needed, and a separate step so a failure is named as a policy failure
      # rather than a build one. It rides the Console job because that job is
      # Node-only and cheap; the rule itself is repository-wide.
      - run: ./scripts/ci/assert-md-line-cap.sh

      # Issue #858. `pnpm-lock.yaml`, read by nothing until now.
      #
      # `npm ci` above is the fidelity guard for `package-lock.json`. There is a
      # SECOND lockfile in that directory and it had no guard at all: nothing in
      # this file mentions pnpm, and the `Desktop` job runs `npm ci` plus
      # `npm run build` directly rather than `tauri build`, so it never reaches
      # Tauri's `beforeBuildCommand` either. The file is not vestigial —
      # `frontend/src-tauri/tauri.conf.json` declares `pnpm dev` / `pnpm build`,
      # so a developer running `npm run tauri:dev` locally resolves through it.
      # It went out of sync on `main` and stayed there until #857 regenerated
      # it; the person who would have found out is whoever next built the
      # desktop app.
      #
      # `--lockfile-only` installs NOTHING — no `node_modules`, ~200ms. It is a
      # consistency check between two committed files, which is why it can ride
      # this job without being able to flake on upstream availability the way a
      # lane that actually resolved ranges would.
      #
      # `--trust-lockfile` skips pnpm 11's supply-chain policy pass, which
      # re-verifies every entry against the registry — 15s and a network
      # dependency, for an answer this step is not asking for. Without it this
      # check would redden for reasons outside the diff, which is the exact
      # property the `npm ci` note above exists to defend.
      #
      # Pinned `pnpm@11` via npx rather than a `packageManager` field: that
      # field would make a corepack-enabled contributor's `npm ci` refuse to
      # run, and npm is this project's primary resolver. The floor pnpm 9 fails
      # to clear is declared in `engines.pnpm` instead — `pnpm-workspace.yaml`
      # uses `allowBuilds`, and pnpm 9 rejects the whole file for having no
      # `packages` key.
      - name: Validate pnpm-lock.yaml against package.json
        run: npx --yes pnpm@11 install --frozen-lockfile --lockfile-only --trust-lockfile
        working-directory: frontend

      # ...and again on the floor `engines.pnpm` declares. pnpm 11 is what a
      # contributor who types `npx pnpm` gets today; 10 is what the manifest
      # and `frontend/README.md` promise still works, and a floor nothing
      # exercises is a claim rather than a contract — the same gap this change
      # exists to close for Node. It is not hypothetical in the other
      # direction: pnpm 9 does fail, on `pnpm-workspace.yaml`.
      #
      # A STEP, not a job. 147ms, and a separate job would mint a check name
      # for something that cannot fail independently of the step above it.
      #
      # No `--trust-lockfile`: that flag is pnpm 11's, and 10 exits with
      # `Unknown option`. Nothing is lost — `--lockfile-only` never reaches the
      # registry pass the flag exists to skip.
      - name: Validate pnpm-lock.yaml on the declared pnpm floor
        run: npx --yes pnpm@10 install --frozen-lockfile --lockfile-only
        working-directory: frontend

      # No lint step: the package declares no lint script. Adding one is a
      # separate decision, not something to smuggle in here.

  # Issue #858. The console suite on whatever Node is current, ADVISORY.
  #
  # Every lane above pins the version in `frontend/.nvmrc`, so a break that only
  # exists on a newer Node is invisible to all of CI while being the first thing
  # a contributor hits — they get whatever they have installed. That is not
  # hypothetical: #852 filed 57 failing tests as a `jsdom` caret-range bug and
  # proposed pinning the dependency. jsdom was innocent on both axes. Node 25
  # exposes WebStorage as an unflagged global, vitest's `populateGlobal` then
  # skips `localStorage`, and `window.localStorage` resolves to an empty object
  # (#857). The proposed pin would have closed the issue with the bug live.
  #
  # A version mismatch surfaces deep inside a dependency's surface area, nowhere
  # near the thing that is wrong, so the honest fix is to make CI able to SEE
  # the newer runtime rather than to keep guessing from the failure's shape.
  #
  # `continue-on-error: true` — deliberately advisory, and the trade is stated
  # rather than assumed. Required, this lane would let a Node release redden
  # pull requests that have nothing to do with it: the version it installs
  # changes without anybody in this repo touching anything, which breaks the
  # property that a red run is attributable to the diff. Advisory, it is
  # ignorable — that is the cost. It is the right side of that trade only
  # because the pinned lane above is what gates merges; this one exists to name
  # a Node-skew break as one, early, in the place where it is cheap to read.
  #
  # A SEPARATE JOB rather than a matrix leg on `Console`: a matrix renames the
  # check to `Console (22)` / `Console (current)`, and branch protection pins
  # the name `Console`. Adding a version axis must not silently unpin the
  # required check.
  #
  # Deliberately NOT the whole `Console` job's step list: no `build`, no policy
  # greps. Those cannot fail for Node-version reasons — the typechecks and the
  # unit suite are the steps where a runtime difference actually shows up, and
  # they are the fast ones.
  console-current-node:
    name: Console (current Node, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `current` is setup-node's alias for the latest release line — the whole
      # point of this lane is that it is NOT pinned, so `.nvmrc` is exactly what
      # it must not read.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: current
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `--ignore-engines` has no npm equivalent, and none is wanted: `engines`
      # declares `>=22`, so a newer Node satisfies it and `npm ci` is quiet.
      # If this step ever fails on the engine check, the declaration is what is
      # wrong, not the runner.
      - run: npm ci
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend
      - run: npm run typecheck:unit
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # Issue #428. The Playwright suite was type-checked by the `Console` job above
  # and executed by NOTHING, which is a worse blind spot than having no suite at
  # all: seventy passing specs that nobody runs look exactly like coverage.
  #
  # What that cost, concretely. `workflow-edit-delete.spec.ts` referenced a
  # fixture that was never committed, so two of its eight tests had never passed
  # in any environment since the day they merged. Two more specs were found red
  # on this branch — one asserting an approval confirmation whose wording #395
  # deliberately changed, one seeding a tour-resume marker whose value moved when
  # Connections became a page of Settings. Both had been red for weeks, and one
  # had been filed as a product bug that does not exist. Nothing reported any of
  # it, because nothing ran it.
  #
  # A SEPARATE JOB, not steps on `Console`: that job is deliberately Node-only —
  # no submodules, no Rust toolchain, no browser — and runs in parallel with the
  # Rust jobs precisely because it shares no setup with them. This lane needs a
  # built host and a browser, so folding it in would slow the fast console gate
  # to the speed of the slowest thing in the repo.
  #
  # `needs: rust` for the binary, and that is the ONLY reason. The host is the
  # default feature set, which is all this suite needs — the harness company
  # boots on the offline echo brain. Four specs that need more than that skip
  # themselves through `test/e2e/capabilities.ts`, each naming issue #467.
  console-e2e:
    name: Console E2E
    runs-on: ubuntu-latest
    needs: rust
    # The suite is ~5 minutes locally against a warm host. The cap is here so a
    # wedged browser or a host that never binds fails in a quarter hour rather
    # than burning the runner's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # No `submodules`, deliberately. The binary arrives prebuilt from the
          # `rust` job and nothing here resolves a cargo manifest, so the large
          # `vendor/openhuman` checkout would be pure cost.

      # Node version from `frontend/.nvmrc`, like every other lane here —
      # see the `Console` job's note (issue #858).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install` — same lockfile-fidelity argument as the
      # `Console` job above.
      - run: npm ci
        working-directory: frontend

      - name: Download the host binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencompany-debug-binary
          path: target/debug

      # `upload-artifact` does not preserve the executable bit, so the binary
      # arrives as a plain file. `test/e2e/host.sh` tests for `-x` and exits
      # with a build instruction, which would be a confusing way to learn this.
      - name: Restore the executable bit
        run: chmod +x target/debug/opencompany

      # `--with-deps` installs the system libraries headless Chromium needs;
      # the runner image ships neither. Chromium only: the suite pins no other
      # engine, and installing three would triple this step for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `playwright.config.ts` brings the host up itself when `PW_BASE_URL` is
      # unset (issue #406) — building the console bundle, wiping an isolated
      # data root under `target/e2e/`, and signing in against the harness
      # company. So this is the whole command.
      - name: Run the end-to-end suite
        run: npm run e2e
        working-directory: frontend

      # A failed browser run is close to undiagnosable from a log alone. The
      # config captures a screenshot on failure and a trace on first retry;
      # this is what makes them reachable from the run summary.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7

  # Issue #467. The lane above is the DEFAULT feature set, and four of the
  # suite's specs cannot pass against it — not because they are wrong, but
  # because the thing they test is not compiled in. They skip themselves through
  # `frontend/test/e2e/capabilities.ts`, which made that lane meaningfully green
  # and left the most valuable coverage in the suite unrun: `wiring.spec.ts`
  # proves the whole chain from a typed message to a rendered reply,
  # `chat-to-card.spec.ts` proves an orchestrator can open a board card,
  # `workflow-run-history.spec.ts` proves a run is journaled durably, and
  # `mcp.spec.ts` proves an agent can call a remote tool. Without them CI proves
  # the console renders, not that the company works.
  #
  # This job runs those four. Three things make that possible, and none of them
  # existed before:
  #
  #   * a host with the harness in it — the gated binary `rust-gated` now
  #     uploads (`--features openhuman,tinycortex,mcp`);
  #   * something for the harness to think with — `test/e2e/mock-brain.mjs`, an
  #     OpenAI-compatible endpoint whose answers are a pure function of the
  #     prompt, which `playwright.config.ts` starts and points the host at;
  #   * a tool server to call — `test/e2e/mcp-server.mjs`, started the same way.
  #
  # A SEPARATE JOB from `Console E2E` rather than a matrix leg of it, on
  # purpose. The default lane is the one that gates a change to the console
  # itself and it stays fast and independent; this one waits on the slowest job
  # in the run (`rust-gated`) and runs a live agent turn per message, so folding
  # them together would put the whole suite behind the gated compile. Keeping
  # both also keeps the default host honestly covered: the product ships with
  # and without these features.
  #
  # NOT `continue-on-error`. A lane that is allowed to be red is the state #428
  # was filed about, at more expense.
  console-e2e-live-brain:
    name: Console E2E (live brain)
    runs-on: ubuntu-latest
    needs: rust-gated
    # Longer than the default lane's half hour: every operator message here runs
    # a real agent turn rather than being answered by the offline echo brain.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # No `submodules`, for the same reason as the lane above: the binary
          # arrives prebuilt and nothing here resolves a cargo manifest.

      # Node version from `frontend/.nvmrc`, like every other lane here —
      # see the `Console` job's note (issue #858).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Download the gated host binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencompany-gated-binary
          path: target/debug

      # `upload-artifact` does not preserve the executable bit, so the binary
      # arrives as a plain file and `test/e2e/host.sh` would answer with a
      # build instruction, which is a confusing way to learn this.
      - name: Restore the executable bit
        run: chmod +x target/debug/opencompany

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # `PW_LIVE_BRAIN=1` is a DECLARATION, not a probe: it says the caller
      # brought a feature-gated host and an inference backend. It is what
      # un-skips the four specs, and — because this run also manages the host —
      # what makes `playwright.config.ts` start the two fixtures and hand the
      # host their addresses. See `frontend/test/e2e/capabilities.ts` for why
      # this cannot be detected from the host instead.
      # `PW_COMPOSIO=1` is the same kind of declaration as `PW_LIVE_BRAIN`: the
      # binary downloaded above carries `--features composio`, so this run can
      # stand up `test/e2e/composio-backend.mjs` and point the host at it
      # (issue #820). Set here rather than in `e2e:live` so a developer running
      # that script against a host without the feature still skips cleanly
      # instead of failing on routes that answer `409 not in this build`.
      - name: Run the end-to-end suite against a live brain
        run: npm run e2e:live
        working-directory: frontend
        env:
          PW_COMPOSIO: "1"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-live-brain-failures
          path: frontend/test-results/
          retention-days: 7

  # The desktop shell.
  #
  # A SEPARATE JOB, and separate for the reason `src-tauri/Cargo.toml` explains
  # at length: the crate is not a workspace member, so no `cargo` invocation in
  # the jobs above reaches it — not even `Check (--all-features)`, which
  # resolves only the root graph. Without this lane the desktop's Rust, its
  # tests and its `Cargo.lock` are built by nothing.
  #
  # That is issue #475's pathology exactly, in a tree that fixes the same thing
  # for the SQLite conformance suite two hundred lines above. A suite everybody
  # reads as coverage, selected by no lane, reporting zero without failing
  # anything.
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    # The webkit toolchain plus a cold Rust compile of the host as a path
    # dependency. The cap is a wedged-runner backstop, not a target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # The desktop links the host crate by path, so its optional vendored
      # manifests must resolve here for the same reason they must in `rust` —
      # Cargo reads every path dependency's manifest during resolution.
      #
      # The script derives the crate list from the pinned
      # `vendor/openhuman/.gitmodules` (issue #592) — nothing here holds a copy.
      - name: Init vendored openhuman crate submodules
        run: scripts/ci/init-vendored-submodules.sh

      # Tauri's system dependencies. `wry` links webkit2gtk, so this is what
      # makes the desktop tree buildable at all — and it is precisely why the
      # crate is kept out of the root workspace, so that checking the SERVER
      # never needs any of it.
      - name: Install webkit and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      # Node version from `frontend/.nvmrc`, like every other lane here —
      # see the `Console` job's note (issue #858).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `tauri-build` reads `frontendDist` from `tauri.conf.json` at build time,
      # so the console bundle has to exist before the Rust crate compiles.
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            frontend/src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # `--no-deps`, matching the gated lane: the host is a path dependency and
      # its lints are that crate's business, not this one's.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings

      # `--locked`, so a manifest edit whose lock was never regenerated is named
      # here rather than absorbed — the desktop keeps its own `Cargo.lock`.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The console's Tauri wrapper is also an independent workspace. It used
      # to inherit the root workspace metadata and lockfile, but OpenHuman now
      # contains nested workspaces of its own, so keeping it independent is
      # what lets Cargo compose the current vendored graph.
      - name: Format console desktop wrapper
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --all -- --check

      - name: Clippy console desktop wrapper
        run: cargo clippy --manifest-path frontend/src-tauri/Cargo.toml --locked --all-targets --no-deps -- -D warnings

      - name: Test console desktop wrapper
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --locked

      # Everything above proves the desktop crate COMPILES. Nothing above proves
      # it PACKAGES, and those are different claims: the steps above drive
      # `cargo` directly and build the console themselves with
      # `working-directory: frontend`, so `tauri.conf.json` — the file that says
      # how the app is actually assembled — was read by nothing in this lane.
      #
      # It was wrong for the whole life of the split. `beforeBuildCommand` named
      # `../frontend`, which escapes the repository from the directory Tauri ran
      # the hook in, so `cargo tauri build` and `cargo tauri dev` failed on their
      # first step for every developer while this lane stayed green (issue #616).
      # A lane that never invokes the packaging entry point makes the first real
      # launch the integration test.
      #
      # The console is built by the `npm run build` step above rather than by a
      # `beforeBuildCommand`, and that is now load-bearing: Tauri runs that hook
      # from a directory it DERIVES, by scanning for a `package.json`, and which
      # one it picks is not stable. On a developer's macOS checkout it lands in
      # `frontend/`; on this runner it landed in `vendor/openhuman/` — also a
      # directory with a `package.json`, reached first because the filesystems
      # enumerate in different orders. No relative path is correct from both, and
      # neither is `$(git rev-parse --show-toplevel)`, which answers with the
      # SUBMODULE's root once the hook lands inside one. So there is no hook: the
      # console is built explicitly, before packaging, by a step whose working
      # directory this file states outright. `frontendDist` stays relative to
      # `src-tauri/`, which is where `tauri.conf.json` lives and is therefore the
      # one path here that cannot drift.
      #
      # `--debug`, not a release build: this step exists to execute the config
      # and link a binary, and the `Test` step above already compiled that graph
      # in the dev profile. A release build would recompile the host from
      # scratch — minutes, for no claim this step is making.
      #
      # `--no-bundle` for the same reason. Bundling produces a `.deb`/AppImage
      # this job would only delete; the failure being gated is the one that
      # happens before any of that, at the first step of `tauri build`.
      #
      # The CLI comes from `frontend/node_modules` — `npm ci` above already
      # installed `@tauri-apps/cli`, so this costs nothing, where
      # `cargo install tauri-cli` would compile the CLI from source.
      #
      # BOTH directories, because a packaging step that runs from exactly one is
      # how #616 stayed invisible: every other step in this lane runs from the
      # repository root, which is the one place the broken hook happened to work.
      # Nothing cwd-dependent is left to gate today, so what these two now defend
      # is that nothing cwd-dependent comes BACK — a reintroduced relative hook
      # fails one of them whichever direction it is wrong in. The second run is
      # nearly free: same profile, same cache, everything already built.
      #
      # These two and no others: the CLI finds a project by searching SUBFOLDERS
      # of the working directory rather than ancestors, so from `frontend/` it
      # would package the console wrapper above instead — a different app that
      # happens to share this one's `productName`.
      - name: Package (from the repository root)
        run: ./frontend/node_modules/.bin/tauri build --debug --no-bundle

      - name: Package (from src-tauri)
        working-directory: src-tauri
        run: ../frontend/node_modules/.bin/tauri build --debug --no-bundle
