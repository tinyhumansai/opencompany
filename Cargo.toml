# Virtual workspace root. OpenHuman's modular dependencies (tinybus,
# tinymemory, tinyagents, ...) each own nested workspaces under `vendor/`.
# Cargo walks every `path =` dependency beneath a workspace root and attaches
# it as a member unless it is excluded; without `exclude = ["vendor"]` the
# vendored crates would attach to THIS workspace and their
# `foo.workspace = true` keys would fail to resolve against a root that never
# declared them. That is the whole of the "nested workspaces cannot resolve"
# problem this file used to cite as the reason not to be a workspace at all;
# the same shape is proven in `vendor/openhuman/vendor/tinybox/Cargo.toml`.
#
# Members:
# - `crates/opencompany-core` — the host (library crate `opencompany`, binary
#   `opencompany`), with its `src/`, `tests/`, `benches/`, `examples/` and
#   `build.rs` beneath it. The data it embeds (`companies/`) and `vendor/`
#   stay here at the root.
# - `crates/opencompany-tui` — the terminal client, embedding the host.
#
# Excluded:
# - `crates/opencompany-app` — the Tauri desktop shell — stays a detached
#   workspace with its own `Cargo.lock`, for the reasons its manifest gives
#   (the Tauri tree out of `cargo metadata --locked`, no GTK on server runners).
# - `worktrees/` holds local git worktrees that must never be walked.
[workspace]
resolver = "3"
members = ["crates/opencompany-core", "crates/opencompany-tui"]
exclude = ["vendor", "worktrees", "crates/opencompany-app"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/opencompany"

# Dependencies more than one member shares. A member inherits one with
# `foo = { workspace = true }`; a member-specific feature is added on top.
[workspace.dependencies]
opencompany-core = { path = "crates/opencompany-core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

# `[patch]` is only honoured at the workspace root, so the tables live here
# rather than beside the dependencies they redirect (in
# `crates/opencompany-core/Cargo.toml`). Paths are relative to this file.
#
# WS4 one level further: `tinycortex-api` (since tinycortex@8401346,
# tinymemory#18 §A1) re-exports the TinyMemory contract and therefore depends
# on `tinymemory-api` by git URL. A git source is not redirected by
# `[patch.crates-io]`, so without this section that git checkout joins the
# graph BESIDE the vendored path copy the core manifest declares — and every shared
# contract type (`MemoryTaint`, `MemoryEntry`, ...) becomes two distinct
# types, which stops `tinymemory-core` compiling. openhuman carries exactly
# this entry for itself (`[patch."https://github.com/tinyhumansai/tinymemory"]`
# in its Cargo.toml); replicated here with the path rebased onto the vendored
# checkout, same as the WS4 entries below.
[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-api" }

# The same hazard one crate over: `tinycortex` depends on `tinyinference` by git
# rev, which `[patch.crates-io]` does not rewrite either. Without this entry
# cargo resolves a second `tinyinference` beside the path copy openhuman and
# this crate use, and the two `ChatModel`s are different types. Replicated from
# openhuman's own Cargo.toml with the path rebased onto the vendored checkout.
[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }

[patch.crates-io]
# No `tinyagents` entry: the crate no longer exists as a package (the workspace
# split), and nothing in the graph asks crates.io for it any more — openhuman
# names the members by path and tinyflows dropped the requirement. An entry here
# would point at a virtual manifest and fail resolution outright.
# WS4: openhuman's own Cargo.toml `[patch.crates-io]` is ignored when it is a
# path dependency, so its vendored-submodule patches must be replicated here
# (paths rebased onto `vendor/openhuman/vendor/...`). These entries are inert in
# the default build — none of these crates are in the graph until the
# `openhuman` feature is on — so they leave the offline build unaffected.
# tinyflows split into a workspace too; the package now lives in `crates/`.
tinyflows = { path = "vendor/openhuman/vendor/tinyflows/crates/tinyflows" }
# TinyCortex moved under TinyMemory at the openhuman pin: `vendor/tinycortex`
# is no longer a submodule there, and the crate is reached through
# `vendor/tinymemory/vendor/tinycortex` instead. A patch path is resolved
# eagerly whatever the feature set — the same trap the `tinyplace` note below
# records — so a stale path here fails `cargo metadata --locked` outright,
# before any feature gate is consulted.
tinycortex = { path = "vendor/openhuman/vendor/tinymemory/vendor/tinycortex" }
# `tinymemory-core` consumes the TinyCortex contract by version while
# OpenHuman consumes the implementation by path. Keep both on one checkout so
# their public trait identities remain identical.
tinycortex-api = { path = "vendor/openhuman/vendor/tinymemory/vendor/tinycortex/api" }
tinychannels = { path = "vendor/openhuman/vendor/tinychannels" }
# No `tinyplace` entry: openhuman dropped the submodule, so the path this
# patched onto no longer exists at the pin and Cargo fails to load the source
# outright — a patch path is resolved eagerly, whatever the feature set. Nothing
# here consumes the crate either; the `tinyplace` FEATURE above is unrelated (it
# only turns on `reqwest`).
# Arrived with the #499 pin bump, and is NOT a submodule — openhuman vendors it
# as a plain in-tree directory. Replicated for the same reason as the entries
# above, but the reason it matters here is specific: without it Cargo resolves
# `motosan-ai-oauth 0.2` from crates.io, whose manifest turns on reqwest's
# default native-tls backend, and the openhuman build would inherit OpenSSL on
# Linux. Openhuman patches it precisely to avoid that; the sole source delta in
# the vendored copy is `default-features = false` on reqwest.
motosan-ai-oauth = { path = "vendor/openhuman/vendor/motosan-ai-oauth" }
whisper-rs-sys = { git = "https://github.com/tinyhumansai/whisper-rs-sys.git", branch = "main" }

# Keep line tables in release artifacts for Sentry symbolication. Cargo emits
# packed platform companions (dSYM/DWP/PDB); shipped binaries stay stripped.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
