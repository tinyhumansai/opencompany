# This package deliberately is not a Cargo workspace root. OpenHuman's modular
# dependencies (TinyBus, TinyMemory, TinyDocs, and TinyWallet) each own nested
# workspaces, which Cargo cannot resolve beneath another workspace root. The
# Tauri package under src-tauri is therefore its own workspace.
[package]
name = "opencompany"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/opencompany"
description = "Company operating system scaffold built on OpenHuman and TinyHumans Rust modules."
readme = "README.md"
keywords = ["company", "agents", "openhuman", "tinyagents", "axum"]
categories = ["web-programming", "asynchronous"]
# Each example is a standalone workspace member crate, not a bare-file example
# target of the host crate.
autoexamples = false

# Live end-to-end smoke for issue #9: one company agent on the embedded
# OpenHuman runtime, one turn against the hosted brain. Needs a credential, so
# it is an explicit example gated on the `openhuman` feature — never built by
# the default `cargo build`/CI.
[[example]]
name = "live_company_turn"
path = "examples/live_company_turn.rs"
required-features = ["openhuman"]

# Server-only end-to-end drive of team orchestration: a company template on the
# real host, mock inference + MCP credentials, one operator message through a
# three-agent hand-off chain. Runs on loopback with no real key, so it is an
# example anyone can run — but it is not built by the default `cargo build`.
[[example]]
name = "team_orchestration_e2e"
path = "examples/team_orchestration_e2e.rs"
required-features = ["openhuman", "mcp"]

[dependencies]
# Compiles agent-authored `Page.tsx` (issue: agent-authored dashboard pages)
# into browser-runnable JS inside `pages_write` (`src/harness/pages_tools.rs`).
# The runtime image's builder stage (see `Dockerfile`) has no Node — only the
# separate frontend Docker build stage does — so turning agent-written TSX into
# something a browser can run has to happen as a Rust-native step, at request
# time, inside this binary. `swc_core` is a pure-Rust TS/JSX compiler with no
# system libs and no Node subprocess, which is the one property that makes that
# possible. Feature-gated to the narrow slice actually used, to keep compile
# times down: `ecma_parser` + `ecma_parser_typescript` parse TSX,
# `ecma_transforms_typescript` strips the type annotations,
# `ecma_transforms_react` rewrites JSX to `jsx`/`jsxs` calls against the
# automatic `"react/jsx-runtime"` import, `ecma_visit` walks the parsed
# `ImportDecl`s for the import allow-list check, and `ecma_codegen` renders the
# transformed AST back to JS text. None of swc's bundler, minifier, CSS, or
# plugin-host surfaces are enabled. Optional: `src/harness/pages_tools.rs` only
# compiles under the `openhuman` feature (all of `src/harness/` does), so this
# links only there — the default build stays offline and unaffected.
swc_core = { version = "77", optional = true, features = [
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms_typescript",
    "ecma_transforms_react",
    "ecma_visit",
    "ecma_codegen",
    "common",
] }
async-graphql = "7"
async-graphql-axum = "7"
async-trait = "0.1"
# `multipart` is what lets the workspace accept a file upload at all (issue
# #553): the existing create route takes a JSON body, and JSON cannot carry
# bytes. Scoped to the one upload route, which sets its own `DefaultBodyLimit`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Direct, not incidental: `Bytes` is the chunk type of `ports::workspace::BlobStream`,
# so it appears in the port's public signature and cannot be a transitive detail.
bytes = "1"
# Extension → media type for uploads and for publishing a generated file. The
# alternative is a hand-rolled table that is wrong for everything nobody thought
# of, on a value the console uses to decide whether to render or download.
mime_guess = "2"
# `ReaderStream`, which turns the file `FsOps` already has on disk into the
# `BlobStream` the port returns — so a large download is never resident.
# `compat` bridges the same helper onto GridFS, whose streams implement
# `futures_io`'s traits rather than tokio's.
tokio-util = { version = "0.7", features = ["compat", "io"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is load-bearing: the operator SSE frames (`project_event`
# in `src/server/operator.rs`) are built by appending keys in a fixed order,
# and the unit tests assert that exact order. That feature used to reach the
# build only by feature-unification luck (an unrelated dependency enabling it);
# the pages feature's dependency reshuffle dropped it, so the frames silently
# re-sorted alphabetically (BTreeMap) and the order assertions failed. Declare
# it here so the json!:insert ordering the SSE stream and its tests rely on is
# deterministic rather than whoever else happens to enable it.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "1"
# The *writing* half of `config.toml`, for the first-run setup flow
# (`src/server/setup.rs`). `toml::to_string` would round-trip the `ConfigFile` struct
# and in doing so delete every comment in the file — including the commented
# `[[default_mcp_server]]` PLACEHOLDER block that `docs/spec/runtime/config.md` treats
# as the shipped source of truth for what an install registers. `toml_edit` mutates the
# parsed document in place, so an operator's comments, key order and formatting all
# survive a write. Pinned to the version `toml` itself builds on, so the dependency
# graph gains no second copy.
toml_edit = "0.25"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Static file serving for the embedded operator console. `ServeDir`/`ServeFile`
# back the `/` SPA fallback so a hosted tenant serves its own console
# same-origin without a separate nginx container. Unconditional but inert: the
# fallback is only mounted when `OPENCOMPANY_CONSOLE_DIR` points at a real
# directory, so the default build's behavior is byte-for-byte unchanged. Pure
# Rust, no system libs, no network.
tower-http = { version = "0.7", features = ["fs"] }

# Exclusive ownership of an instance data root (`src/store/lock.rs`). An OS
# advisory lock rather than a pid file: the kernel drops it when the process
# exits for ANY reason, so there is no stale state to detect and nothing for an
# operator to delete by hand. Already in `Cargo.lock` as a transitive
# dependency, so this declaration adds no new download — the same reasoning
# `base64` and `url` are declared under. Pure Rust, no system libs.
fs2 = "0.4"
# `ServiceExt::oneshot` lets the `/` SPA fallback hand a request off to
# `ServeDir` from inside an axum handler, so reserved server prefixes can 404
# before the static service ever sees them. Already in the tree via `tower-http`
# and `axum`, so this is a direct-use declaration, not new compilation.
tower = { version = "0.5", features = ["util"] }

tinyagents = { path = "vendor/openhuman/vendor/tinyagents", optional = true, features = ["sqlite"] }

# WS4: openhuman embedded as a library (the harness). Only links under the
# `openhuman` feature; the default build pulls none of this enormous native
# dependency tree. `default-features = false` sheds openhuman's whole default
# set — `tokenjuice-treesitter`, `voice`, `web3`, `media`, `meet`,
# `flows` — none of which a company agent needs; it wants the agent
# loop, memory, and an inference provider. `mcp` is re-enabled (issue #50):
# per-tenant MCP tool servers reuse OpenHuman's `mcp::config_servers` registry +
# `mcp::http_client` transport + injection-safety filter (all three were
# `mcp_client` before the #499 kernelization split it) and the `mcp_list_servers` /
# `mcp_list_tools` / `mcp_call_tool` bridge tools. Upstream `mcp = []` carries
# no extra crates — it only recompiles the MCP client/registry modules.
# `skills` is re-enabled: cell #28
# surfaces a company's effective skill set to its harness agents through
# OpenHuman's own skill *read* tools (`list_workflows` / `describe_workflow` /
# `read_workflow_resource`), which live in the gated `openhuman::skills`
# domain. The feature carries no extra deps (`skills = []` upstream) — it only
# recompiles the skills domain modules. TinyAgents is consumed from OpenHuman's
# own pin so both crates always share one trait identity and cannot drift.
# `hosting` adds the `hosting_*` tools and the `tinyhosts` unified hosting API
# behind them (`openhuman::hosting`), which is what lets a company put its
# workspace on a real hosting provider. Taken without OpenHuman's TinyBus
# module: `tinyhosts` is linked as a library, so nothing here loads a cdylib.
openhuman_core = { package = "openhuman", path = "vendor/openhuman", optional = true, default-features = false, features = ["skills", "mcp", "hosting"] }
# The openhuman `Provider`/`Memory` traits return `anyhow::Result` and log via
# the `log` facade; both only link under the `openhuman` feature.
anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# Console MCP OAuth (issue #90): base64url for PKCE (S256 challenge + verifier
# entropy) and URL building for the `/authorize` redirect. Already in the tree
# via `openhuman_core` + `reqwest`, so pinning it as a direct dep adds no new
# Cargo.lock entry; it links only under the `mcp` feature.
base64 = { version = "0.23", optional = true }
# NOT optional, deliberately (issue #673). `src/policy/consequence.rs` derives a
# standing grant's host scope with this parser, and it must be *the same* parser
# `reqwest` uses to perform the fetch — a grant key computed by a second,
# hand-rolled reader is a bypass waiting to be found, which is precisely how the
# `https://evil.com\@docs.rs/` confusion arose in review of that issue.
#
# Feature-gating it would put the security boundary behind `#[cfg]` and, worse,
# make its regression tests vacuous in the default lane — a suite that cannot
# run the hostile-input table is not protecting anything. Already in the tree
# via `reqwest`, so this adds no new Cargo.lock entry either way.
url = "2"

# Issue #29 (epic #26): the tinyflows workflow engine, embedded directly. It is
# host-agnostic and Config-free — `Capabilities` is a plain struct of trait
# objects — so a company's workflows run on it without booting any OpenHuman
# global `Config`/registry. Only links under the `openhuman` feature; the
# `[patch.crates-io]` entry below already redirects it at the vendored copy
# (`vendor/openhuman/vendor/tinyflows`, 0.8.x — 0.6.x before the #840 resync).
# The requirement below tracks that major-for-0.x move because a `[patch]`
# replaces the crate's SOURCE, not the version requirement it has to satisfy, so
# a stale `0.5` fails resolution outright rather than quietly building the old
# copy. Its `tinyagents` requirement resolves to the already-vendored
# `vendor/openhuman/vendor/tinyagents`, so this adds no second copy.
# We deliberately do NOT enable openhuman's own `flows` feature: that drags in
# rhai + the builder tools, defeating the point of running tinyflows directly.
tinyflows = { version = "0.8", optional = true }

# Issue #105: attribute-tolerant `<tool_call>` tag normalization in the harness
# tool dispatcher. The staging model emits `<tool_call id="…">…</tool_call>`
# with an attribute on the open tag, which OpenHuman's bare-literal parser never
# matches, so the whole call leaks into chat as text and the tool never runs.
# `AttrTolerantXmlDispatcher` (`src/harness/tool_dispatcher.rs`) strips those
# attributes before delegating. Only links under the `openhuman` feature; regex
# is already in the tree via `openhuman_core`, so this adds no new Cargo.lock
# entry — it is a direct-use declaration.
regex = { version = "1", optional = true }

# Optional network client shared by the feature-gated integrations below; the
# default build links no network crates.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }

# Real HMAC-SHA256 webhook signing. Pure-Rust, no system libs, no network beyond
# the shared `reqwest` client used by `HttpWebhookSink`.
hmac = { version = "0.12", optional = true }

# Hashing (session/login-code digests) and OS randomness (minting them). Both
# are unconditional: a build that cannot hash or generate a random token cannot
# authenticate a human, and user auth is not an optional surface. Both are
# pure-Rust and offline — `getrandom` is a syscall shim — so the "default build
# links no network crates" invariant is untouched. Feature-gating them instead
# would push `#[cfg]` through StorageHandles, three backends, and the
# conformance suite to defend nothing.
# ────────────────────────────────────────────────────────────────────────────
# Document text extraction for Brain uploads (`documents` feature)
# ────────────────────────────────────────────────────────────────────────────
# What a file dropped on the Brain page has to become before memory can hold
# it: text. Plain formats need nothing; these three cover the ones an operator
# actually drops — a contract PDF, a spec `.docx`, a pricing `.xlsx`, a deck.
#
# In the DEFAULT feature set, on the `oauth` precedent: the drop zone is a
# first-class console surface, and a shipped build where dropping a PDF stores
# nothing would be a feature that exists only for people who compile their own
# binary. All three are pure Rust with no system libraries.
#
# `zip` + `quick-xml` are the whole of OOXML: `.docx`, `.pptx` are zip archives
# of XML, and walking them directly is smaller than a document library. `.xlsx`
# is not — shared-string tables and cell typing make hand-parsing it a
# liability — so `calamine` reads that one.
pdf-extract = { version = "0.12", optional = true }
calamine = { version = "0.34", optional = true }
quick-xml = { version = "0.41", optional = true }
zip = { version = "6", default-features = false, features = ["deflate"], optional = true }

sha2 = "0.10"
getrandom = "0.4"

# Argon2id password hashing. Unconditional for the same reason as sha2: a build
# that cannot verify a password cannot log a human in. Pure-Rust RustCrypto, no
# system libs, no network. `default-features = false` + "alloc"/"password-hash"
# drops argon2's own RNG feature — salts come from the crate's TokenSource seam
# instead, so there is one source of randomness rather than two.
argon2 = { version = "0.5", default-features = false, features = [
    "alloc",
    "password-hash",
] }

# Real signed per-tenant JWT verification for platform auth.
jsonwebtoken = { version = "9", optional = true }

# SQLite-backed implementations of the storage ports. The `bundled` feature
# vendors SQLite into the build, so no system libsqlite3 is required and the
# compile stays fully offline. Only links under the `sqlite` feature.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# MongoDB-backed implementations of the storage ports (official async driver).
# Only links under the `mongodb` feature; the default build stays offline.
mongodb = { version = "3", optional = true }

# TinyCortex in-pod memory engine (local SQLite kv/vectors/entity + content
# vault). Only links under the `tinycortex` feature. Resolved to the vendored
# submodule via the `[patch.crates-io]` entry below — the *same* crate instance
# `openhuman_core` already links unconditionally — so enabling this on top of an
# `openhuman` build adds no new compilation. Backs the `EngineCortex`
# persistent memory + context overlay; never makes a network call.
tinycortex = { version = "0.1", optional = true }

# TinyMemory — the engine-neutral memory *contract* (issue #914), as distinct
# from the TinyCortex *engine* above. `MemoryProvider` with three mandatory
# capability families and ten optional ones, negotiated once at bind time.
#
# These are path deps rather than `[patch.crates-io]` entries because the crates
# are `publish = false`: there is no registry version for a patch to replace.
# The paths are byte-identical to the ones `vendor/openhuman/Cargo.toml`
# declares, which is load-bearing — Cargo unifies two path deps only when they
# resolve to the same directory, and two copies of `tinymemory-api` would mean
# two nominally distinct `MemoryProvider` traits in one process.
#
# NOT `tinycortex-api`: that crate pins `CONTRACT_VERSION = (1, 0)` while this
# one is at `(2, 0)`, `is_compatible` is major-equality only, and OpenHuman's
# own inlined contract documents `tinycortex-api` as a deprecated re-export.
# `docs/spec/runtime/orchestration/memory.md` names this path for that reason.
#
# `tinymemory` carries the driver registry (`DriverRegistry::admit`) and the
# mandatory-family composition (`MemoryTraitProvider`); `tinymemory-remote`
# carries the HTTP adapters for hosted engines.
#
# `tinymemory-tinycortex` is the seam between the engine-side `Memory` trait
# vocabulary and the contract's — `TinycortexMemory` converts entry/opts types
# in both directions. The `namespace` driver rides it: `UnifiedMemory`
# implements the engine-side trait, and the adapter is what lifts it to a
# `MemoryProvider`. Gated behind `tinymemory-embedded` with `tinymemory-core`,
# NOT part of `tinymemory`: depending on it unconditionally would drag
# `tinycortex`, and with it a bundled SQLite build, into a tenant that
# selected a hosted engine over HTTP and needs neither (tinymemory#18 §D).
tinymemory = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory", optional = true }
tinymemory-api = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-api", optional = true }
tinymemory-remote = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-remote", optional = true }
# `tinymemory-core` carries `UnifiedMemory` — the contract's own durable SQLite
# store (`impl Memory for UnifiedMemory`, driver id `namespace`) — which is what
# lets the *embedded* mode bind through the provider seam instead of around it
# (`OPENCOMPANY_MEMORY=embedded` + `OPENCOMPANY_MEMORY_DRIVER=namespace`).
#
# It is a separate feature from `tinymemory` on purpose: this crate pulls
# `tinycortex` (with `obsidian`, `persona`, `people`, `sync`),
# `tinyagents/sqlite`, and a bundled `rusqlite` — exactly the in-pod engine
# weight a tenant that selected a hosted engine over HTTP does not want
# (tinymemory#18 §D). `remote` and `null` continue to need only the three
# contract crates above. Same single-checkout rule as those three: the path is
# byte-identical to the one `vendor/openhuman/Cargo.toml` declares.
tinymemory-core = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-core", optional = true }
tinymemory-tinycortex = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tinycortex", optional = true }
# The TinyBus module seam (issue #1524): `tinybus` hosts the loadable
# TinyMemory module's broker, and `tinymemory-bus` carries the wire
# vocabulary the host speaks to it — method-name constants
# (`names::methods::*`) and the shared error table (`wire::from_wire`).
# `tinymemory-bus` must be a DIRECT dependency: `tinymemory-api` re-exports
# eleven bus modules but not `names`, so the transitive path does not
# compile. `macros` on tinybus is mandatory (the service/proxy derives), and
# the same directory as openhuman's own tinybus dep so cargo unifies the two
# into one package.
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus", optional = true, default-features = false, features = ["macros"] }
tinymemory-bus = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-bus", optional = true }

# Single-file `.tar` packing/unpacking for `opencompany export`/`import`. Pure
# Rust, no system libs, no network. Only links under the `export` feature; the
# port-driven bundle core works on an unpacked directory without it.
tar = { version = "0.4", optional = true }

# Recursive DNS resolution for custom-domain verification. Only links under the
# `dns` feature; the `DnsResolver` trait + offline `StaticDnsResolver` compile
# without it.
hickory-resolver = { version = "0.24", optional = true }

# SMTP outbound transport for the test-send and per-teammate outbound mail. Only
# links under the `smtp` feature; the `MailSender` trait + offline mock compile
# without it. Pure-Rust rustls TLS so no system libs are required.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"], optional = true }

# IMAP inbound transport + RFC822 parsing for per-teammate mail receiving. Only
# link under the `imap` feature; the `MailReceiver` trait + offline mock compile
# without it. Pure-Rust rustls TLS so no system libs are required.
#
# `async-imap` with `runtime-tokio` links no TLS of its own (unlike `lettre`,
# it takes an already-connected stream in `Client::new`), so `AsyncImapReceiver`
# builds the TLS connection itself: `tokio-rustls` for the handshake and
# `webpki-roots` for the trusted root set, both already in the dependency graph
# transitively via `lettre`'s rustls stack — declaring them directly here just
# names the version this module actually calls.
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"], optional = true }
mail-parser = { version = "0.11", optional = true }
tokio-rustls = { version = "0.26", optional = true }
webpki-roots = { version = "1", optional = true }

# Offline Ed25519 + base58. Not optional, because wallet sign-in
# (`[users].mode = "wallet"`) is one of the three answers a company may configure
# for how humans authenticate, and it verifies an Ed25519 signature over a
# base58 address. Behind a feature, a shipped binary would parse
# `mode = "wallet"`, report it on `/auth/config`, and then be unable to check a
# single signature — a configuration the build silently does not implement.
#
# The tiny.place economy identity uses the same three for the same reason a
# second implementation was never wanted: one signer, one base58 handling.
# `rand_core`'s `getrandom` feature provides `OsRng` for seed generation; we call
# `SigningKey::from_bytes` so dalek's own `rand_core` feature stays off. All
# three are pure Rust with no native dependency.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
bs58 = { version = "0.5", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[features]
# `oauth` ships in the standard build: the connection write routes
# (authorize-url + server-side token exchange) are a first-class console
# surface, so a company can connect GitHub end-to-end without a custom feature
# build. It only pulls in `reqwest`, which several already-shipped features
# (`github`, `telegram`, `medulla`, …) also depend on, so the default build
# gains no new heavy native dependency. The read-only status route
# (`ops::connections_read`) is un-gated and available regardless.
#
# `platform-jwt` ships in the standard build because it is the *only* way a
# shipped build can accept a tenant-scoped machine credential: the platform
# verifier authenticates a bearer either by knowledge of the shared secret or by
# an HS256 signature, and nothing else. Leaving it optional made the signed path
# a build-time opt-in, and — because cargo features are additive and no CI lane
# enabled it — its tests were compiled by the check-only `--all-features` step
# and *run* by nothing. Moving it into the default set makes both `cargo test`
# lanes execute them, which is why this needs no new CI lane. It costs one pure
# dependency (`jsonwebtoken`), already in `Cargo.lock`.
default = ["oauth", "platform-jwt", "documents"]
# Text extraction for files dropped on the Brain page (PDF, Word, Excel,
# PowerPoint). Without it those formats still upload and are still refused
# honestly — the route reports "no text could be extracted" rather than
# storing an empty memory — while plain text, Markdown, HTML, JSON, CSV and
# source files are extracted by the always-compiled path. In the default set;
# see the dependency block for why.
# `reqwest` rides along because "remember this link" is the same feature as
# "remember this file" from the operator's side, and a build that reads a
# dropped PDF but cannot fetch a URL would be a distinction nobody asked for.
# It is already in the default set via `oauth`, so this adds nothing there.
documents = ["dep:pdf-extract", "dep:calamine", "dep:quick-xml", "dep:zip", "dep:reqwest"]

tiny = ["tinyagents"]
# WS4: embed `vendor/openhuman` (`openhuman_core`) directly as the tenant agent
# harness via `AgentBuilder`. `src/harness/` compiles only under this feature;
# the default build stays offline and echo-brained (byte-for-byte unaffected).
# `reqwest` is pulled in for the hosted Medulla inference model; the
# `MockProvider` and every adapter compile without touching the network.
# Enables `tiny` so the `tinyagents` crate is in scope: the harness's inference
# models implement its `ChatModel<()>` trait (openhuman's old `Provider` trait
# was deleted upstream); it is the same vendored crate `openhuman_core` uses.
openhuman = ["tiny", "dep:openhuman_core", "dep:reqwest", "dep:anyhow", "dep:log", "dep:tinyflows", "dep:regex", "dep:uuid", "dep:swc_core"]
# MCP server management and agent tools share OpenHuman's in-process registry.
# Enabling it necessarily enables the embedded harness and OpenHuman MCP
# domain, while the default build remains unchanged.
mcp = ["openhuman", "openhuman_core/mcp", "dep:uuid", "dep:base64"]
# Image/video generation tools (issue #109, epic #26 Cell B). Bridges
# OpenHuman's `media_generation` tools (`media_generate_image`,
# `media_generate_video`, `media_list_models`) into a company agent's toolbelt
# behind the opt-in `media` grant namespace and a MANAGED platform credential.
# Enabling it necessarily enables the embedded harness and OpenHuman's own
# `media` domain; the default build links none of it. Real money moves through
# these tools, so they are wired only when a company explicitly grants `media`
# (never via the `*` wildcard) AND a managed credential is configured.
media = ["openhuman", "openhuman_core/media"]
# Per-tenant Composio tools (issue #110, epic #26 Cell D). Bridges OpenHuman's
# backend-mode Composio surface (Gmail / Slack / GitHub via
# `composio_list_toolkits`, `composio_list_connections`, `composio_list_tools`,
# `composio_authorize`, `composio_execute`) into a company agent's toolbelt
# behind the opt-in `composio` grant namespace and a per-tenant OAuth bearer
# token. The upstream `composio` domain is not itself feature-gated, so no
# `openhuman_core/*` subfeature is needed — enabling this only pulls in the
# embedded harness. The default build links none of it. Tenant isolation is the
# server-side-constructed bearer token (the backend derives the Composio entity
# from the JWT); the token has NO env fallback and a missing token fails closed
# (no tools wired), so a company can never reach another tenant's connections.
composio = ["openhuman"]
# Real HTTP transport to openhuman-core. The trait + offline mock + providers
# compile without this; only `HttpOpenHumanRpc` is gated behind it.
openhuman-rpc = ["dep:reqwest"]
# Real GitHub REST filer for feedback issues. The `GitHubClient` trait + offline
# mock + the whole filing flow compile without this; only `HttpGitHubClient` is
# gated behind it.
github = ["dep:reqwest"]
# Real HTTP forwarding of feedback to the TinyHumans hub, so a provisioned
# instance records reports against its credential's owner. The
# `TinyHumansClient` trait + offline mock + the whole routing decision compile
# without this; only `HttpTinyHumansClient` is gated behind it.
tinyhumans = ["dep:reqwest"]
# Real HTTP/Socket.IO transport to hosted Medulla. The wire types + offline
# MockTransport compile without this; only the networked transport is gated.
medulla = ["dep:reqwest"]
# tiny.place economy: Ed25519 identity, SIWX auth, x402 payment authorization,
# and (in later batches) the HTTP transport. Card projection + wire types stay
# in the default build; only crypto and the networked client are gated here.
# Ed25519 keys and signatures, lifted out from under `tinyplace` (issue: the
# runner lane needs them too).
#
# `tinyplace` used to own `economy::signer` outright, which meant the runner
# handshake could only exist in a build that also pulled the whole tiny.place
# economy — an unrelated surface. Naming the capability separately lets two
# features share one reviewed signing implementation instead of growing a
# second one, which is the outcome worth avoiding: two curves, or two base58
# key parsers, is how a signature check comes to differ between two callers.
tinyplace = ["dep:reqwest"]
# The Agent Client Protocol: the `/acp` endpoint's session/permission surface
# and the `RunTurn` implementation over an ACP agent.
#
# Named as a feature because both modules already document themselves in terms
# of one — `server::acp` reasons about "a build without the feature" and
# `routes::RESERVED_PREFIXES` reserves `/acp` so such a build 404s rather than
# answering an ACP client with the console shell. Until this existed the code
# compiled into every build, was served by no route and run by no lane.
acp = ["openhuman"]
# The runner control lane: machines that dial out and execute this host's work.
# Dispatch folds an ACP turn into a `TurnOutcome`, which lives behind
# `openhuman` along with the `RunTurn` seam it satisfies, and drives it over the
# `AcpAgent` port from `acp`.
runner = ["acp"]
# Real HTTP POST webhook delivery + HMAC-SHA256 signing. The `WebhookSink` trait,
# the offline `RecordingWebhookSink`, and the deterministic default signer
# compile without this; only `HttpWebhookSink`/`HmacSha256Signer` are gated here.
webhooks = ["dep:reqwest", "dep:hmac"]
# Real signed per-tenant JWT verification. The `PlatformVerifier` trait and the
# offline `StaticPlatformVerifier` compile without this; only the JWT verifier is
# gated behind it.
platform-jwt = ["dep:jsonwebtoken"]
# SQLite-backed storage ports (CompanyStore/EventLog/MemoryStore/ContextStore
# plus SecretStore) sharing one bundled connection. The fs stores and the
# port-conformance suite compile without this; only `SqliteStore` is gated here.
sqlite = ["dep:rusqlite"]
# MongoDB-backed storage ports (CompanyStore/EventLog/MemoryStore/ContextStore
# plus SecretStore) sharing one database handle — the multi-tenant platform
# backend: every document is keyed by company_id and the hosting layer gives
# each tenant its own database on a shared cluster. The fs stores and the
# port-conformance suite compile without this; only `MongoStore` is gated here.
mongodb = ["dep:mongodb"]
# TinyCortex-backed MemoryStore + ContextStore. Pulls the vendored `tinycortex`
# engine crate (an unconditional dep of `openhuman_core`, so no new build cost
# under an `openhuman` build) and exposes `EngineCortex`: an in-pod, persistent,
# per-company memory engine over the crate's local SQLite kv tier. Ships in
# degraded lexical/recency recall mode — no embedding compute injected yet
# (that lands in 188c2). The fs stores and the port-conformance suite compile
# without this; the offline `InMemoryCortex` remains the test/fallback backend.
tinycortex = ["dep:tinycortex"]
# The TinyMemory `MemoryProvider` contract (issue #914): binds the three memory
# ports to one engine-neutral driver instead of three independent backends, and
# turns the memory engine into an operator choice — the embedded engine in-pod,
# or a hosted service behind a URL and a credential.
#
# Distinct from `tinycortex` above, which is one *engine*. This feature is the
# *seam*: with it on, `OPENCOMPANY_MEMORY` additionally accepts `remote` and
# `null`, and `embedded` becomes an alias for `tinycortex`.
#
# Deliberately does NOT imply `tinycortex`. The two modes are independent code
# paths: `remote`/`null` bind a provider here, `embedded` uses the `tinycortex`
# overlay. Selecting `embedded` without that feature refuses loudly at boot
# ("requires a build with the `tinycortex` feature"), which is the right
# outcome — and it lets a hosted-memory tenant build without linking a bundled
# SQLite it will never call (tinymemory#18 §D).
tinymemory = [
    "dep:tinymemory",
    "dep:tinymemory-api",
    "dep:tinymemory-remote",
    # The contract's storage trait (`tinymemory_api::traits::Memory`) returns
    # `anyhow::Result`, so anything implementing or calling it has to name
    # `anyhow` directly. Already an optional dep for other features.
    "dep:anyhow",
]
# The loadable TinyMemory module driver (issue #1524). Forwards tinybus's
# loader sub-feature from opencompany's OWN gate — never from the dependency
# line — mirroring how openhuman forwards it, so a build without this feature
# carries no dlopen loader. Known consequence: cargo unifies our tinybus with
# openhuman's (same directory), so enabling the loader enables it there too.
tinymemory-module = ["tinymemory", "dep:tinymemory-bus", "dep:tinybus", "tinybus/modules"]
# The embedded mode *through* that seam: `OPENCOMPANY_MEMORY=embedded` +
# `OPENCOMPANY_MEMORY_DRIVER=namespace` binds `tinymemory-core`'s durable
# `UnifiedMemory` (driver id `namespace`) as an in-pod provider — same
# registry admission, same bind-time capability audit, same tenant-namespace
# facades as `remote`, no network. Without the driver knob, `embedded` keeps
# the incumbent `EngineCortex` overlay untouched; this feature adds a mode
# beside it rather than migrating its data (`store::memory::driver` module
# docs walk through why).
#
# Separate from `tinymemory` because it costs the in-pod engine weight —
# `tinycortex` + `tinyagents/sqlite` + bundled `rusqlite` — that hosted-memory
# tenants deliberately avoid (tinymemory#18 §D).
tinymemory-embedded = ["tinymemory", "dep:tinymemory-core", "dep:tinymemory-tinycortex"]
# Node sidecar brain for self-hosters (bring-your-own-inference). Adds
# `SidecarBrain`, which speaks the same `/orchestration/v1` wire frames as the
# hosted brain but against a local sidecar process, with inference routed back
# into the Rust host through an `InferenceClient`. Process launch uses the
# already-enabled tokio `process` feature and real inference rides the existing
# `tiny` feature, so this flag adds no dependency. The whole brain, its mocks,
# and the offline end-to-end test are gated here; the default build links none
# of it and the builder routes `sidecar` mode to the echo brain.
sidecar = []
# Single-file `.tar` bundle packing for `opencompany export`/`import`. The
# port-driven export/import core (unpacked bundle directory) compiles without
# this; only `pack_tar`/`unpack_tar` are gated here.
export = ["dep:tar"]
# Recursive DNS resolution for custom-domain verification. The `DnsResolver`
# trait, the offline `StaticDnsResolver`, and the pure record generation compile
# without this; only `HickoryDnsResolver` is gated here.
dns = ["dep:hickory-resolver"]
# Real SMTP send for the domain/email surface. The `MailSender` trait and the
# offline `RecordingMailSender` compile without this; only `LettreMailSender` is
# gated here.
smtp = ["dep:lettre"]
# Real IMAP receive for the email surface. The `MailReceiver` trait and the
# offline `RecordingMailReceiver` compile without this; only `AsyncImapReceiver`
# and the RFC822 parser are gated here.
imap = ["dep:async-imap", "dep:mail-parser", "dep:tokio-rustls", "dep:webpki-roots"]
# Real HTTPS transport to api.telegram.org for the Telegram channel
# (sendMessage / setWebhook). The `TelegramApi` trait, inbound parsing, token
# scrubbing, and the offline `RecordingTelegramApi` compile without this; only
# `HttpTelegramApi` is gated here (it needs the shared `reqwest` client).
telegram = ["dep:reqwest"]
# OAuth connection lifecycle (authorize-url + server-side token exchange). The
# read-only connections catalog compiles without this; only the token-exchanging
# write routes are gated here (they need the shared `reqwest` client).
oauth = ["dep:reqwest"]
# Issue #788: Chargebee billing integrated as backend service code, surfaced to
# agents as callable tools. NOT a separate MCP server and NOT a second binary —
# the integration lives in the tenant workload so the credential can be
# per-company, held in that company's own SecretStore. The only gated dependency
# is the shared `reqwest` client the REST calls use; `src/chargebee/` compiles
# only under this feature, so the default build is unaffected.
chargebee = ["dep:reqwest"]
# Issue #789: PayPal wallet + transaction reads, same shape as `chargebee`
# above — backend service code, per-company credentials, only `reqwest` gated.
paypal = ["dep:reqwest"]

# WS4 one level further: `tinycortex-api` (since tinycortex@8401346,
# tinymemory#18 §A1) re-exports the TinyMemory contract and therefore depends
# on `tinymemory-api` by git URL. A git source is not redirected by
# `[patch.crates-io]`, so without this section that git checkout joins the
# graph BESIDE the vendored path copy declared above — and every shared
# contract type (`MemoryTaint`, `MemoryEntry`, ...) becomes two distinct
# types, which stops `tinymemory-core` compiling. openhuman carries exactly
# this entry for itself (`[patch."https://github.com/tinyhumansai/tinymemory"]`
# in its Cargo.toml); replicated here with the path rebased onto the vendored
# checkout, same as the WS4 entries below.
[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-api" }

[patch.crates-io]
# Reuse OpenHuman's own TinyAgents pin (2.1.0). This satisfies OpenHuman's
# `^2.1` requirement while keeping a single checkout and crate identity.
tinyagents = { path = "vendor/openhuman/vendor/tinyagents" }
# WS4: openhuman's own Cargo.toml `[patch.crates-io]` is ignored when it is a
# path dependency, so its vendored-submodule patches must be replicated here
# (paths rebased onto `vendor/openhuman/vendor/...`). These entries are inert in
# the default build — none of these crates are in the graph until the
# `openhuman` feature is on — so they leave the offline build unaffected.
tinyflows = { path = "vendor/openhuman/vendor/tinyflows" }
tinycortex = { path = "vendor/openhuman/vendor/tinycortex" }
# `tinymemory-core` consumes the TinyCortex contract by version while
# OpenHuman consumes the implementation by path. Keep both on one checkout so
# their public trait identities remain identical.
tinycortex-api = { path = "vendor/openhuman/vendor/tinycortex/api" }
tinychannels = { path = "vendor/openhuman/vendor/tinychannels" }
tinyplace = { path = "vendor/openhuman/vendor/tinyplace/sdk/rust" }
# Arrived with the #499 pin bump, and is NOT a submodule — openhuman vendors it
# as a plain in-tree directory. Replicated for the same reason as the entries
# above, but the reason it matters here is specific: without it Cargo resolves
# `motosan-ai-oauth 0.2` from crates.io, whose manifest turns on reqwest's
# default native-tls backend, and the openhuman build would inherit OpenSSL on
# Linux. Openhuman patches it precisely to avoid that; the sole source delta in
# the vendored copy is `default-features = false` on reqwest.
motosan-ai-oauth = { path = "vendor/openhuman/vendor/motosan-ai-oauth" }
whisper-rs-sys = { git = "https://github.com/tinyhumansai/whisper-rs-sys.git", branch = "main" }

[dev-dependencies]
tempfile = "3"

# The upstream driver-conformance suite (`assert_provider`, `retains_writes`),
# run in `src/store/memory/upstream_conformance_test.rs` against the providers
# `open_driver` constructs. Unconditional on purpose — dev-dependencies cannot
# be optional — and cheap on purpose: the crate is contract-only
# (tinymemory-api + async-trait + serde_json + anyhow), deliberately barred
# from reaching any engine, so it adds no engine weight to any lane's graph.
# Same byte-identical-path rule as the `tinymemory*` entries above.
tinymemory-conformance = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-conformance" }
# `test-util` only — for `#[tokio::test(start_paused = true)]`, which the git
# deadline test needs to fire a timeout deterministically instead of racing a
# real child process. Dev-only: under resolver v2 this feature is not unified
# into normal builds, so the shipped binary is unchanged.
tokio = { version = "1", features = ["test-util"] }

# Issue #392: measures what a per-append flush costs, so the per-record-kind
# durability policy rests on a number rather than an intuition. Default features
# off — the plotting and rayon extras would be dead weight in every test lane's
# dependency graph, and this bench reports numbers rather than charts.
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }

# Opt-in only (`cargo bench --bench journal_append`). Not wired into CI: it is a
# measurement of the host's storage, and a shared runner's numbers would mean
# nothing to gate on.
[[bench]]
name = "journal_append"
harness = false
