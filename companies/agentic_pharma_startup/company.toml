# Agent roster for the Agentic Pharma Startup harness.
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Agentic Pharma Startup"
output = "Candidate molecules and trial plans"
human_role = "Laboratory work"

# The research-review desk pairs candidate evidence with the trial plan before lab work begins.
[[group_chat]]
id = "research_review"
name = "Research review desk"
description = "Coordinate candidate evidence and trial planning for laboratory review."
members = ["molecule_discovery", "simulation_agent", "trial_planner"]

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["discovery_pipeline"]

# Approval tier for this company (issue #605). Declared explicitly rather than
# left to the serde default, so the tier a shipped company runs on is readable
# from its own manifest instead of inferred from an absent block.
#
# `auto` runs the agent's own sandbox writes and outward reads unattended and
# policy HITL is disabled; agents use `request_approval` when they want sign-off. `always_approve`
# is omitted, so it keeps its default.
[policy]
mode = "auto"
