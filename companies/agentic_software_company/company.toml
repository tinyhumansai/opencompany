# Agent roster for the Agentic Software Company harness.
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Agentic Software Company"
output = "An entire SaaS product"
human_role = "Product direction"

[tools]
# Full tool belt plus the metered `web_search` (#238, granted here in #878):
# this company's agents are asked to research prior art, APIs, competitors and
# CVEs, and nothing in the `web` namespace can *find* a URL — `web_fetch` /
# `http_request` only read one the agent already has.
#
# Every entry below is load-bearing. `allow` REPLACES the default
# (`globals/globals.toml`'s `default_allow`); it never extends it. `*` covers
# files/docs/shell/code/web/subagent but deliberately excludes the rest, so
# `workspace.*` and `workspace.write` (the latter is explicit because the host
# recognizes only the exact write grant), `media`, `composio`,
# `search` and `mcp:*` are each listed literally. This line is the default belt
# restated verbatim; keeping it written out is what makes a narrowing here a
# visible edit rather than an inherited surprise.
# media/composio/mcp also require their Cargo features compiled into the tenant
# image, and each is fail-closed at runtime until its credential/config is
# present (Composio bearer, media backend, per-server MCP config). Reducing this
# line to `["search"]` would silently strip the whole belt from every agent in
# the company.
#
# Search spend is bounded by `[tools].search_daily_calls` (200/day by default);
# setting it to `0` pauses search without editing this list.
#
# `chargebee` (#788) is a CEILING, not a grant: every agent in `agents/` states
# a `tools` line that omits it, so nobody this template ships holds billing
# tools. A software business that invoices its customers names the teammate who
# does from the console — `PATCH {scope}/team/{agent_id}` with `chargebee`
# added — and that edit is an overlay this manifest never sees.
#
# It is here at all because the alternative is that the capability is
# unreachable: `[tools].allow` has no runtime write path, so a company booted
# from this bundle could store a Chargebee key and still have it reach no
# teammate, with nothing in the console able to fix it (#1854).
#
# `*` does not cover it. These tools mail invoices to a real business's real
# customers, so the grant is opted into by name rather than ridden in on a
# wildcard set for files and shell.
allow = ["*", "workspace.*", "workspace.write", "media", "composio", "search", "mcp:*", "chargebee"]

# There is deliberately no `[tools.composio].toolkits` here. Absent means "open
# mode": defer to the backend's own server-enforced allowlist, which is every
# toolkit it permits — roughly a hundred — rather than a list this file has to
# keep in step by hand.
#
# A non-empty list would be authoritative and offered verbatim: the backend
# catalog is not consulted and nothing may widen it, because a fetch must never
# hand a company providers it decided against. So setting it caps both the agent
# belt and the Connections tab at whatever is typed here.
#
# It briefly was set, as a workaround for the console rendering zero provider
# rows on an empty list (#397). That root cause is fixed — the host now answers
# open mode with the live catalog — so re-adding a list here to make providers
# appear would restore the cap it was meant to relieve. Narrow it only to
# genuinely narrow this company.

# Group chats — the desks the human talks to. Each pulls in a few agents from
# the roster above; the first member is the desk's lead (the routing target).
[[group_chat]]
id = "engineering"
name = "Engineering"
description = "Build, test, and secure the product."
members = ["backend_engineer", "frontend_engineer", "qa_engineer", "security_engineer"]

[[group_chat]]
id = "product_design"
name = "Product & Design"
description = "Roadmap, specs, and the user experience."
members = ["product_manager", "designer"]

[[group_chat]]
id = "go_to_market"
name = "Go-to-Market"
description = "Docs, developer relations, and customer support."
members = ["devrel", "docs_writer", "customer_support"]

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["feature_pipeline", "incident_response"]

# Approval tier for this company (issue #605). Declared explicitly rather than
# left to the serde default, so the tier a shipped company runs on is readable
# from its own manifest instead of inferred from an absent block.
#
# `auto` runs the agent's own sandbox writes and outward reads unattended and
# policy HITL is disabled; agents use `request_approval` when they want sign-off. `always_approve`
# is omitted, so it keeps its default.
[policy]
mode = "auto"
