role = "Product Manager"
description = "Own the roadmap, specs, and prioritization."
# Declared explicitly because the roster now lives in one file per teammate
# (`agents/*.toml`), which is read in filename order. Before the move this
# company tagged nobody and relied on `[[agent]]` declaration order, where this
# teammate came first. Stating the tier keeps the same agent orchestrating
# instead of handing the job to whoever sorts first alphabetically.
tier = "orchestrator"

# Desk lead (issue #884): may hand one slice to a peer on this desk with
# `delegate_to_teammate`, instead of declining work addressed to a specialist.
# Naming its own desk is the enable switch; depth stays capped at 2.
delegates_to = ["product_design"]

# The role's working rules, checked in beside this file and read at manifest
# load. The `.toml` carries the wiring; `prompts/` carries how the role works.
# A missing path here is a manifest error rather than a skipped entry — a role
# whose prompt was written around a briefing it never received fails silently.
prompt_files = ["prompts/product_manager.md"]

# The company belt minus `chargebee` (#788, #1854). Stated explicitly rather
# than left empty because an omitted `tools` line inherits the WHOLE company
# grant, billing included — omission is how capability arrives here, not how it
# is withheld. This member's desk states no ceiling, so an operator naming them
# the biller from the console can add `chargebee` here.
tools = ["*", "workspace.*", "workspace.write", "media", "composio", "search", "mcp:*"]
