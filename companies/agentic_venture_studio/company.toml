# Agent roster for the Agentic Venture Studio harness.
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Agentic Venture Studio"
output = "A portfolio of startups"
human_role = "Capital allocation and major strategic decisions"

[tools]
# The default belt plus `chargebee` (#788) — the CEILING, not the grant. A studio that stands up companies bills for the
# work, and `finance` is the teammate that does it. `founder` is deliberately
# not among them: it can ask finance.
#
# `allow` REPLACES the default rather than extending it, so the inherited belt
# is restated verbatim before `chargebee` is appended. `*` does not cover
# `chargebee`: these tools mail invoices to a real business's real customers,
# so the namespace is opted into by name.
#
# Every teammate below states its own `tools` line for the same reason — an
# omitted line takes this whole ceiling, so silence would hand billing to all
# of them.
allow = ["*", "workspace.*", "workspace.write", "media", "composio", "search", "mcp:*", "chargebee"]

# The venture-launch desk keeps the founding, product, and market owners aligned on the new company.
[[group_chat]]
id = "venture_launch"
name = "Venture launch desk"
description = "Coordinate venture launch readiness and the next strategic decision."
members = ["founder", "engineer", "marketer"]

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["venture_launch_pipeline", "kill_review"]

# Approval tier for this company (issue #605). Declared explicitly rather than
# left to the serde default, so the tier a shipped company runs on is readable
# from its own manifest instead of inferred from an absent block.
#
# `auto` runs the agent's own sandbox writes and outward reads unattended and
# policy HITL is disabled; agents use `request_approval` when they want sign-off. `always_approve`
# is omitted, so it keeps its default.
[policy]
mode = "auto"
