role = "Skeptic"
description = "Read the statement literally and hunt the misreading everybody else's fluent answer is quietly resting on."
# No tier: this role attacks the *reading*, not the arithmetic, and does not
# need the strongest model bought to notice "below" is not "up to".
context = ["GOAL.md", "brief.md"]

# No `shell`/`code`: this seat reads the statement literally and works one
# small case by hand (see prompts/skeptic.md, "Work one small case by hand")
# — it never runs a program, unlike brute_forcer/programmer/theorist, so it
# does not need execution access.
tools = ["files", "workspace.read", "mcp:*"]

ledgers = [
    { name = "tasks", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
    { name = "risks", access = "record" },
    { name = "commitments", access = "read" },
    { name = "learnings", access = "record" },
    { name = "attempts", access = "record" },
    { name = "answers", access = "read" },
]

prompt_files = ["prompts/skeptic.md"]
