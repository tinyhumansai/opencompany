role = "Scribe"
description = "Write the accepted answer and the method that reached it where the next problem can find them."
context = ["GOAL.md", "brief.md", "METHOD.md", "attempts.md", "answers.md"]

# The one role that may write the shared note tree, and the one with no shell:
# a recorder that can re-run the program is a recorder that will eventually
# record a number nobody else saw.
tools = ["files", "docs", "workspace", "workspace.write", "mcp:*"]

ledgers = [
    { name = "tasks", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
    { name = "risks", access = "record" },
    { name = "commitments", access = "read" },
    { name = "learnings", access = "record" },
    { name = "attempts", access = "read" },
    { name = "answers", access = "record" },
]

prompt_files = ["prompts/scribe.md"]
