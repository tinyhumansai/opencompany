role = "Theorist"
description = "Reduce the problem to something a program can finish, and state the small cases the answer must reproduce."
tier = "reasoning"
context = ["GOAL.md", "brief.md", "METHOD.md", "attempts.md"]

# Shell, because a conjecture about a sequence is settled by computing twenty
# terms of it rather than by staring. What the theorist may NOT do is answer the
# stated problem — see `prompts/theorist.md`. The boundary is in the brief and
# in the ledger: this role opens attempts, it never closes an answer.
tools = ["files", "shell", "workspace.read", "mcp:*"]

ledgers = [
    { name = "tasks", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
    { name = "risks", access = "record" },
    { name = "commitments", access = "read" },
    { name = "learnings", access = "record" },
    { name = "attempts", access = "record" },
    { name = "answers", access = "read" },
]

prompt_files = ["prompts/theorist.md"]
