# Workflow graph: campaign_pipeline
#
# Referenced by `[workflows].enabled = ["campaign_pipeline"]` in ../company.toml.
# Graphs live here (one file per workflow) rather than inline in the manifest:
# they are larger and edited by the Workflow canvas, on their own lifecycle.
#
# Node kinds mirror the tinyflows model (trigger / agent / tool_call /
# http_request / condition / output). This is a data-only definition; the
# manifest only records that this workflow is enabled.

id = "campaign_pipeline"
name = "Campaign pipeline"
description = "A brief goes from intake to a published post."

[[node]]
id = "brief"
kind = "trigger"
name = "New campaign brief"
summary = "Client drops a brief in the inbox."

[[node]]
id = "strategist"
kind = "agent"
name = "Strategist"
summary = "Turns the brief into an angle + outline."
agent = "brand_strategist"

[[node]]
id = "gate"
kind = "condition"
name = "Needs research?"
summary = "Branch on topic familiarity."
[node.config]
field = "=item.needs_research"

[[node]]
id = "research"
kind = "tool_call"
name = "Web research"
summary = "Pulls sources and competitor takes."
# `on_error` is a first-class node field, NOT a `config` key — the validator
# rejects reserved keys inside `[node.config]`. `continue` means a search that
# fails (e.g. no managed search credential on this install) becomes an error
# item on the default port and the run proceeds to `copy`, instead of halting
# the whole pipeline. web_search degrades gracefully with no credential.
on_error = "continue"
[node.config]
# The metered discovery tool wired by the workflow tool belt (issue #238); the
# `web` namespace can only read a URL the agent already has, never find one.
slug = "web_search"
[node.config.args]
# Bind the strategist's reply as the query: `=`-expressions resolve against the
# input item, and an agent node returns `{ text, agent_ref }` (see caps::mod).
query = "=item.text"
max_results = 5

[[node]]
id = "copy"
kind = "agent"
name = "Copywriter"
summary = "Drafts the post from the outline."
agent = "copywriter"

[[node]]
id = "design"
kind = "agent"
name = "Designer"
summary = "Generates the hero image."
agent = "creative_director"

[[node]]
# No CMS exists to POST to, and the human sign-off is `[company].human_role`, so
# this is an agent assembly step, not an HTTP call. Reusing `copywriter` across
# two nodes is legal — the id stays `publish` so the edges are untouched.
id = "publish"
kind = "agent"
name = "Assemble final post"
summary = "Assemble the publish-ready post and hero-image reference, then hand off for operator sign-off."
agent = "copywriter"

[[node]]
id = "done"
kind = "output"
name = "Report back"
summary = "Summarize what shipped."

# Strategy, because this report closes the loop the brief opened: the strategist
# turned the client's brief into the angle, and "what shipped" is only meaningful
# read against it. Creative made the post and already saw it; growth runs
# acquisition on a campaign this pipeline does not measure.
[node.destination]
kind = "channel"
target = "strategy"

[[edge]]
from = "brief"
to = "strategist"

[[edge]]
from = "strategist"
to = "gate"

[[edge]]
from = "gate"
to = "research"
label = "yes"

[[edge]]
from = "gate"
to = "copy"
label = "no"

[[edge]]
from = "research"
to = "copy"

[[edge]]
from = "copy"
to = "design"

[[edge]]
from = "design"
to = "publish"

[[edge]]
from = "publish"
to = "done"
