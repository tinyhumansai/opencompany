role = "Copywriter"
description = "Write ads, pages, and campaign copy."

# A custom prompt is appended to the generated persona, never substituted for
# it: the generated line is what binds this agent to *this* role at *this*
# company, and replacing it would cost the agent its identity. What belongs here
# is how the role works, not who it is.
prompt = """
Write for the reader, not the client. Open on the problem they already have,
in their words. Never open on the company.

One idea per sentence. Cut every adjective you cannot defend with a number or
an example. If a line would survive being pasted into a competitor's ad, it is
not specific enough to ship.
"""

# Checked-in briefing documents, resolved relative to this `agents/` directory
# and read at manifest load. These are version controlled beside the agent, so
# they are placed early in the prompt where a provider cache can reuse them; a
# path that does not exist is a manifest error rather than a skipped entry,
# because a role whose prompt was written around a briefing it never received
# fails silently and confidently.
prompt_files = ["prompts/house-style.md", "prompts/copywriter.md"]
# Live workspace documents, placed last in the prompt — after every tool brief —
# because they are the most volatile thing in it. Unlike `prompt_files` these are
# operator-owned and may not exist yet, so a missing one is skipped rather than
# refused. Editing either note reaches the next turn without a restart.
context = ["brand/brand-voice.md", "playbooks/campaign-checklist.md"]

# Visibility/read-record scope (docs/spec/runtime/ledgers.md): this specialist
# manages its own work on the board and sees, but does not redefine, company
# direction. The orchestrator keeps unrestricted access.
ledgers = [
    { name = "tasks", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
    # The global baseline (`globals/ledgers/`). Every teammate may raise a risk
    # and record what it learned — both are worthless if only the orchestrator
    # can write them, because the teammate that hit the thing is the one that
    # knows. `commitments` stays read-only: promising something outward is not a
    # specialist's call to make alone.
    { name = "risks", access = "record" },
    { name = "commitments", access = "read" },
    { name = "learnings", access = "record" },
    # This agency's own axes (`ledgers/`).
    { name = "campaigns", access = "read" },
    { name = "audiences", access = "read" },
    { name = "experiments", access = "record" },
]

# The company belt minus `chargebee` (#788), stated explicitly rather than left
# empty because an omitted `tools` line inherits the WHOLE company grant,
# billing included — omission is how capability arrives here, not how it is
# withheld. The creative desk ceiling already strips `search`/`media`/`composio`
# from this member; stating the belt here additionally keeps the `chargebee`
# exclusion riding on the member, so a future cross-seat onto an unrestricted
# desk (desks combine by UNION) cannot widen them to billing. An operator naming
# this member the biller from the console adds `chargebee` here.
tools = ["*", "workspace.*", "workspace.write", "media", "composio", "search", "mcp:*"]
