# Agent roster for the Agentic Marketing Agency harness.
# The OpenCompany host instantiates one runtime agent per `agents/<id>.toml`, backed by
# the vendored OpenHuman / TinyAgents modules.

[company]
name = "Agentic Marketing Agency"
output = "Campaigns across every channel"
human_role = "Campaign review and sign-off"

[tools]
# Full tool belt plus the metered `web_search` (#238, granted here in #312): this
# company's skills instruct agents to search broadly and cite their sources, and
# nothing in the `web` namespace can *find* a URL — `web_fetch` / `http_request`
# only read one the agent already has.
#
# Every entry below is load-bearing. `allow` REPLACES the default
# (`globals/globals.toml`'s `default_allow`); it never extends it. `*` covers
# files/docs/shell/code/web/subagent but deliberately excludes the rest, so
# `workspace.*` and `workspace.write` (the latter is explicit because the host
# recognizes only the exact write grant), `media`, `composio`,
# `search` and `mcp:*` are each listed literally. This line is the default belt
# restated verbatim; keeping it written out is what makes a narrowing here a
# visible edit rather than an inherited surprise.
# Reducing this line to `["search"]` would silently strip the whole belt from
# every agent in the company.
#
# Search spend is bounded by `[tools].search_daily_calls` (200/day by default);
# setting it to `0` pauses search without editing this list.
#
# `chargebee` (#788) is a CEILING, not a grant: every shipped teammate below
# states a `tools` line that omits it, so nobody this file ships holds billing
# tools. An agency that bills its clients names the teammate who does from the
# console — `PATCH {scope}/team/{agent_id}` with `chargebee` added — and that
# edit is an overlay this manifest never sees.
#
# The exclusion lives at the per-agent layer rather than on a desk ceiling
# because that layer is the one an operator can rewrite: desk ceilings are
# manifest-only and cannot be widened from the console, so a ceiling-based
# exclusion would make the billing grant unreachable. An agent's own `tools`
# line and an operator's per-teammate override are both INTERSECTED with this
# line, so a grant absent here can never be handed out by anyone. The ceiling
# says what this kind of company may do; who actually does it is the
# operator's call.
allow = ["*", "workspace.*", "workspace.write", "media", "composio", "search", "mcp:*", "chargebee"]

# Group chats — the desks the human talks to. Each pulls in a few agents.
# Members must be ids declared under `agents/`.
#
# A desk is also a scoping level: its optional `tools` is the middle term of
# `[tools].allow ∩ desk.tools ∩ agent.tools`. Stating a ceiling here restricts
# every member at once, so a teammate seated on the desk later inherits the
# restriction instead of quietly arriving with the company's full belt. Omitting
# it narrows nothing — which is what `strategy` and `growth` do here: the
# `chargebee` exclusion is stated per teammate (in `agents/`) so an operator can
# still name a biller from the console without hitting an unwidenable ceiling.
[[group_chat]]
id = "strategy"
name = "Strategy desk"
description = "Plans, priorities, and direction."
members = ["brand_strategist", "seo_specialist", "analytics_analyst"]
# No ceiling. This desk plans and measures; its members' `tools` lines carry
# the `chargebee` exclusion instead, which keeps nobody billing by default while
# leaving the per-teammate layer — the one the console can rewrite — open for
# an operator to name who does.
[[group_chat]]
id = "creative"
name = "Creative studio"
description = "Copy, design, and campaigns."
members = ["creative_director", "copywriter", "landing_page_builder"]
# The creative desk writes; it does not spend on generated media or on billed
# search. Both are simply left out rather than denied, because every level of
# this narrowing is subtractive — a desk can only remove capability, never add
# it, so omission *is* the mechanism.
#
# `*` is listed because it is not a wildcard over everything: it covers
# files/docs/shell/code/web/subagent and deliberately excludes the opt-in
# namespaces (`media`, `composio`, `search`, `repo`), which is exactly the line
# this desk wants. The company grants `media`/`composio`/`search` above; none of
# them reach these three agents.
#
# `workspace.write` is listed because workspace writes are another explicit
# opt-in that `*` does not confer — the host recognizes only the exact
# `workspace.write` grant (`grants_workspace_write_explicit`). The company
# grants it above, but a desk ceiling of `["*"]` alone would strip it from the
# whole desk: this desk's agents live in `agents/<id>/` folders their own
# AGENTS.md documents as always writable, so the write token has to ride through
# the ceiling or the desk's own charter silently stops holding.
#
# The billing exclusion also rides on each member: their `tools` lines are the
# company belt minus `chargebee` (#788), so this ceiling is not their only
# guard. That matters because a teammate on two desks takes the UNION of their
# ceilings — without the belt on them, seating one of these agents on an
# unrestricted desk would hand the company grant, billing included, straight
# back. The ceiling still narrows the belt further, keeping `search`, `media`
# and `composio` off the desk.
tools = ["*", "workspace.write"]

[[group_chat]]
id = "growth"
name = "Growth desk"
description = "Acquisition and lifecycle."
members = ["paid_ads_manager", "email_marketer"]
# No ceiling, for the reason the strategy desk states: the `chargebee`
# exclusion lives on the members' `tools` lines, and an operator naming one of
# them as the biller from the console must not hit an unwidenable desk layer.
# Growth buys attention and runs lifecycle email; billing a client for it is
# somebody else's job.

# Integrations to prioritize wiring. Intent only — scopes and why, never
# secrets. Nothing here provisions a credential: the manager injects no
# OPENCOMPANY_OAUTH_* variable into a tenant, so the native Connect flow is the
# self-hosted hatch only (see src/server/ops/connections.rs). On the hosted
# platform, agents reach Gmail / Slack / GitHub through Composio, which
# authenticates with the instance's own platform identity.
[[connection]]
provider = "slack"
priority = "high"
scopes = ["chat:write", "channels:read"]
reason = "Post campaign updates and take requests."

[[connection]]
provider = "gmail"
priority = "high"
scopes = ["gmail.send", "gmail.readonly"]
reason = "Send lifecycle email from a connected inbox."

[[connection]]
provider = "google-analytics"
priority = "medium"
scopes = ["analytics.readonly"]
reason = "Measure campaign performance."

# Workflow graphs to enable. The graphs live in this company's workflows/
# directory (one file per id), not inline here.
[workflows]
enabled = ["campaign_pipeline", "performance_review"]

# Approval tier for this company (issue #605). Declared explicitly rather than
# left to the serde default, so the tier a shipped company runs on is readable
# from its own manifest instead of inferred from an absent block.
#
# `auto` runs the agent's own sandbox writes and outward reads unattended and
# policy HITL is disabled; agents use `request_approval` when they want sign-off. `always_approve`
# is omitted, so it keeps its default.
[policy]
mode = "auto"
