# The end-to-end test harness company.
#
# A copy of `companies/openhuman_demo` with two additions:
#
#   * a `[users] admins` list, so the Playwright wiring suite
#     (frontend/test/e2e) can log in through the real magic-link flow and drive
#     the operator console against a running host — see
#     `frontend/test/e2e/wiring.spec.ts`;
#   * `workflows/committed.toml`, a source-defined workflow the console must
#     refuse to edit or delete — see `frontend/test/e2e/workflow-edit-delete.spec.ts`.
#
# Every `agents/<id>.toml` becomes one live openhuman agent when built with the
# `openhuman` feature and an inference credential is present. Without a
# credential the same company still boots on the offline echo brain — which is
# all the load check needs.

[company]
name = "E2E Harness Co"
output = "Answers, plans, and short written drafts"
human_role = "Steering the company and approving anything costly"

[policy]
# Policy-generated HITL is disabled. Agents call `request_approval` explicitly;
# `readonly` remains a hard denial for mutations.
mode = "full"

[users]
# Standing admin invite: this address may redeem a magic link and administer
# the company. It is the identity the e2e suite authenticates as.
admins = ["harness-e2e@tinyhumans.ai"]

[tools]
# Composio integration tools (Gmail/Slack/GitHub). Fail-closed until a
# per-company Composio bearer is set via the console.
#
# `workspace` opens the company's own note tree — the same tree the console's
# Workspace tab reads and writes (issue #177). Without it here, no agent gets so
# much as `workspace_list`, because every agent below lists its tools explicitly
# and per-agent grants are narrowed by this allow-list.
#
# Both forms are needed: this list is matched with exact/glob semantics, so bare
# `workspace` covers an agent asking for `workspace` but NOT one asking for
# `workspace.read`, and `workspace.*` covers the sub-grants but not the bare one.
#
# `web` exists for the workflow E2E suite, not for any agent below. A `tool_call`
# node is refused at author time unless its slug's namespace is one the workflow
# invoker wires (shell/code/web/search) AND this list grants it, so without a
# grant here no `tool_call` node can be saved in this company at all — which is
# what `workflow-node-config.spec.ts` authors. `web` is the cheap one to grant:
# `web_fetch` needs no managed credential and costs nothing per call, unlike the
# priced `search` family, which additionally requires an explicit grant so a
# wildcard can never buy a metered request.
allow = ["composio", "mcp:*", "workspace", "workspace.*", "web"]

[[group_chat]]
id = "engineering"
name = "Engineering desk"
description = "How things are built and technical plans."
members = ["engineer"]

[[group_chat]]
id = "content"
name = "Content desk"
description = "Written drafts and copy."
members = ["writer"]

[[mcp_server]]
name = "deepwiki"
endpoint = "https://mcp.deepwiki.com/mcp"
description = "AI-generated documentation and Q&A for public GitHub repositories."

# Bring-Your-Own-Key inference — commented so the harness keeps the
# managed/echo brain. Uncomment + set a key from the console to route agents
# through your own provider. Switching is live (no restart) via the per-tenant
# provider that re-resolves this config each turn.
#
# [inference]
# provider = "ollama"
# base_url = "http://localhost:11434/v1"
#
# [inference.models]
# "chat-v1" = "llama3.1"
