# The end-to-end test harness company.
#
# A copy of `companies/openhuman_demo` with one addition: a `[users] admins`
# list, so the Playwright wiring suite (frontend/test/e2e) can log in through
# the real magic-link flow and drive the operator console against a running
# host. See `frontend/test/e2e/wiring.spec.ts`.
#
# Every [[agent]] becomes one live openhuman agent when built with the
# `openhuman` feature and an inference credential is present. Without a
# credential the same company still boots on the offline echo brain — which is
# all the load check needs.

[company]
name = "E2E Harness Co"
output = "Answers, plans, and short written drafts"
human_role = "Steering the company and approving anything costly"

[policy]
# `full` lets ordinary turns flow without an approval prompt; costly or
# external effects still route through the gate.
mode = "full"

[users]
# Standing admin invite: this address may redeem a magic link and administer
# the company. It is the identity the e2e suite authenticates as.
admins = ["harness-e2e@tinyhumans.ai"]

[tools]
# Composio integration tools (Gmail/Slack/GitHub). Fail-closed until a
# per-company Composio bearer is set via the console.
#
# `workspace` opens the company's own note tree — the same tree the console's
# Workspace tab reads and writes (issue #177). Without it here, no agent gets so
# much as `workspace_list`, because every agent below lists its tools explicitly
# and per-agent grants are narrowed by this allow-list.
#
# Both forms are needed: this list is matched with exact/glob semantics, so bare
# `workspace` covers an agent asking for `workspace` but NOT one asking for
# `workspace.read`, and `workspace.*` covers the sub-grants but not the bare one.
allow = ["composio", "mcp:*", "workspace", "workspace.*"]

[[agent]]
id = "ceo"
role = "Chief Executive"
description = "Sets direction, answers about the company, and delegates the work."
tier = "orchestrator"
# `workspace.read` is read-only by design: writes need a bare `workspace` or an
# explicit `workspace.write`, so this cannot silently overwrite operator notes.
tools = ["mcp:*", "composio", "workspace.read"]

[[agent]]
id = "engineer"
role = "Engineer"
description = "Explains how things are built and proposes technical plans."
tools = ["mcp:*", "composio", "workspace.read"]

[[agent]]
id = "writer"
role = "Writer"
description = "Turns rough notes into short, clear written drafts."
# The one agent that may edit a note, so the "an agent wrote it, the operator
# sees it" round trip is demonstrable out of the box.
tools = ["mcp:*", "composio", "workspace"]
# Issue #304 — one capped teammate so the Team page has a live per-agent budget
# to render, and `team-budget.spec.ts` can assert the capped/uncapped split for
# real rather than against a fixture. Deliberately generous: the harness runs on
# the offline echo brain, which meters no cost, so spend stays $0.00 and this
# cap never trips during a suite run.
budget_usd_daily = 5.0

[[group_chat]]
id = "engineering"
name = "Engineering desk"
description = "How things are built and technical plans."
members = ["engineer"]

[[group_chat]]
id = "content"
name = "Content desk"
description = "Written drafts and copy."
members = ["writer"]

[[mcp_server]]
name = "deepwiki"
endpoint = "https://mcp.deepwiki.com/mcp"
description = "AI-generated documentation and Q&A for public GitHub repositories."

# Bring-Your-Own-Key inference — commented so the harness keeps the
# managed/echo brain. Uncomment + set a key from the console to route agents
# through your own provider. Switching is live (no restart) via the per-tenant
# provider that re-resolves this config each turn.
#
# [inference]
# provider = "ollama"
# base_url = "http://localhost:11434/v1"
#
# [inference.models]
# "chat-v1" = "llama3.1"
