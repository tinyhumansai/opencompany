# A minimal company for the embedded OpenHuman harness (issue #9).
#
# Every `agents/<id>.toml` becomes one live openhuman agent, wired with memory, an
# explicit approval-request tool and the hosted inference provider. Run it with the harness
# brain by setting an inference credential in the environment:
#
#   TINYHUMANS_API_KEY=<jwt> \
#   OPENCOMPANY_INFERENCE_URL=https://api.tinyhumans.ai/openai/v1 \
#   cargo run --features openhuman --bin opencompany -- \
#     serve --company companies/openhuman_demo
#
# Without a credential the same company still boots — it just answers with the
# offline echo brain instead of a real agent turn.

[company]
name = "OpenHuman Demo Co"
output = "Answers, plans, and short written drafts"
human_role = "Steering the company and answering explicit approval requests"

[policy]
# Policy-generated HITL is disabled. `readonly` remains a hard brake on
# mutations; other modes do not create approval prompts. Agents ask explicitly
# with `request_approval` when they need an operator decision.
mode = "full"

[tools]
# The company's own note tree — the same one the console's Workspace tab reads
# and writes (issue #177). An agent-requested grant is narrowed by this list, so
# without `workspace` here no agent below would receive even `workspace_list`.
#
# Both forms are needed: this list is matched with exact/glob semantics, so bare
# `workspace` covers an agent asking for `workspace` but NOT one asking for
# `workspace.read`, and `workspace.*` covers the sub-grants but not the bare one.
allow = ["mcp:*", "workspace", "workspace.*", "chargebee", "paypal"]

# Desks (group chats) the orchestrator can hand a turn to. Each desk's first
# member is its lead; `delegate_to_desk` runs that member's turn.
[[group_chat]]
id = "engineering"
name = "Engineering desk"
description = "How things are built and technical plans."
members = ["engineer"]

[[group_chat]]
id = "content"
name = "Content desk"
description = "Written drafts and copy."
members = ["writer"]

# A real, public, no-auth MCP tool server (DeepWiki — AI docs for GitHub
# repositories). Its tools (read_wiki_structure / read_wiki_contents /
# ask_question) reach every agent granted `mcp:*` above. Add credentialed
# servers at runtime from the console's Connections tab.
[[mcp_server]]
name = "deepwiki"
endpoint = "https://mcp.deepwiki.com/mcp"
description = "AI-generated documentation and Q&A for public GitHub repositories."

# Bring-Your-Own-Key inference. Uncomment to route this company's
# agents through your own provider instead of the managed TinyHumans brain.
# Omitting the section (the default) keeps the managed brain. The credential is
# NEVER written here — set it write-only from the console's Connections tab, or
# name a secret-store key with `api_key_secret`. You can also switch providers
# live from the console (Connections → Inference) with no restart.
#
# [inference]
# provider = "openrouter"          # managed | openrouter | openai_compatible | ollama
# # base_url = "https://openrouter.ai/api/v1"   # defaulted for openrouter/managed
#
# [inference.models]               # abstract tier → concrete provider model id
# "chat-v1" = "deepseek/deepseek-chat"
# "reasoning-v1" = "deepseek/deepseek-r1"
